# Cloud Run service — the MyWeli backend (G1).
#
# Declarative on purpose: the whole service (sidecar, secrets, probes, scaling)
# is reviewable in a PR, which is the one property that made the Render
# Blueprint good and that the Render *dashboard* cron jobs lacked — they were
# invisible to review, which is how the reminder cron came to be off without
# anyone noticing. (That Blueprint is gone; the lesson is why this file exists.)
#
# Deployed by .github/workflows/deploy-backend.yml, which substitutes __IMAGE__.
# Never `gcloud run deploy --set-env-vars` by hand: that creates a revision that
# silently diverges from this file.
#
# **This file has a twin: `service-staging.yaml`.** Most of it is deliberately
# identical there — the probes, `timeoutSeconds`, the container-dependencies
# ordering fix, `startup-cpu-boost`, both containers' resource limits and the
# pinned proxy image — because a staging environment that differs where it did
# not have to is rehearsing something else. Tuning any of those here without
# tuning them there is the whole failure mode, so
# `backend/test/infra/service_files_test.dart` asserts the shared subset matches
# and that the per-environment fields (service name, database, secrets, ingress,
# scaling) do not.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: myweli-api
  labels:
    cloud.googleapis.com/location: europe-west9
  annotations:
    # Only the global load balancer may reach this service. Without it the
    # *.run.app URL is a SECOND public front door, bypassing the LB (and any
    # Cloud Armor policy attached to it later).
    #
    # ORDERING: Cloud Scheduler called the run.app URL directly until this
    # landed. Both jobs were repointed at api.myweli.com and PROVEN to still
    # return 200 BEFORE this annotation was applied — reversing that order
    # stops the reminder cron silently, which is the exact failure this
    # migration already fixed once (infra-gcp-migration.md §5).
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      labels:
        # WHAT COMMIT IS THIS REVISION RUNNING? Today that question takes four
        # steps — find the deploy run, read its log, notice whether it PROMOTED
        # a tag or built one, map the tag back to a commit — and it is
        # answerable wrongly. It was: run 32151417428 records
        # headSha=d36fe475 and shipped an image built from b64dda0, because it
        # promoted. Anyone reading the run alone concludes production runs a
        # commit it has never run.
        #
        # A label on the REVISION (not the service) makes the artifact answer
        # for itself, in one command, and keeps answering correctly after a
        # rollback — an old revision reports the commit IT was built from:
        #
        #   gcloud run services describe myweli-api --region europe-west9 \
        #     --format='value(spec.template.metadata.labels.commit)'
        commit: __RELEASE__
      annotations:
        # The Cloud SQL instance the proxy sidecar may reach.
        run.googleapis.com/cloudsql-instances: myweli:europe-west9:myweli-db

        # THE ORDERING FIX. main.dart:12 awaits initializeDatabase(), which
        # opens a real connection at migrations.dart:885 to take the advisory
        # lock. There is no retry and no backoff, the image is FROM scratch so
        # not even a shell `wait-for-it` is possible, and postgres 3.5.12's
        # connectTimeout is a deadline rather than a grace period — a refused
        # TCP connect fails instantly. Without this annotation the app can
        # reach migrations before the proxy is listening and the revision dies.
        run.googleapis.com/container-dependencies: '{"app":["cloudsql-proxy"]}'

        # min-instances 1: every cold start serializes behind the schema
        # advisory lock before the port is bound, so user traffic must never be
        # the thing that triggers a cold start.
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '4'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: myweli-run@myweli.iam.gserviceaccount.com
      # Generous, and set explicitly rather than inherited: migrations + five
      # seed/backfill steps run before the port opens.
      timeoutSeconds: 300
      containers:
        # ---- the API ------------------------------------------------------
        - name: app
          image: __IMAGE__
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: ENV
              value: prod
            - name: TZ
              value: UTC
            # Phone OTP stays off: SMS is deferred until company registration.
            # Load-bearing — if this is unset, `explicit` is false, ALL four
            # methods turn on including phone, and the Google/Apple/Resend
            # fail-fasts stop firing (auth_methods.dart:9-21).
            - name: AUTH_METHODS
              value: google,apple,email
            # Messaging deliberately off. Must be explicit: unset falls through
            # to auto-detect → null → the `guardsOn` fail-fast, which now fires
            # at boot in staging and production alike (BACKEND.md §3.2.2).
            - name: MESSAGING_PROVIDER
              value: disabled
            # CORS. An empty allowlist used to fail *silently server-side* —
            # clean 200s in the logs while every browser read from the site was
            # blocked. It is now a boot fail-fast, so a deploy that drops this
            # variable never serves traffic (BACKEND.md §3.2.2).
            - name: WEB_ORIGINS
              value: https://myweli.com,https://www.myweli.com,https://admin.myweli.com
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: DATABASE_URL, key: latest }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: JWT_SECRET, key: latest }
            # **The OIDC half of cron auth, which was never mounted.** `CronAuth`
            # verifies the Google-signed token Cloud Scheduler already sends —
            # but only when BOTH of these are set, and neither was, so the
            # better mechanism has been inert since it shipped and every cron
            # run has authenticated on the `X-Cron-Secret` header alone. The
            # header is the transitional fallback, and it cannot be retired
            # until the path replacing it is demonstrably carrying traffic.
            #
            # Purely additive: `authenticate()` falls through to the secret when
            # the token is absent or the audience is wrong, deliberately, so a
            # misconfiguration here cannot take the crons down.
            #
            # `CRON_SERVICE_ACCOUNT` is what makes the audience mean anything —
            # any Google account can mint a token for a public string, so
            # without pinning the caller's identity the audience is not a check.
            - name: CRON_OIDC_AUDIENCE
              value: https://api.myweli.com
            - name: CRON_SERVICE_ACCOUNT
              value: myweli-scheduler@myweli.iam.gserviceaccount.com
            - name: MESSAGING_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: MESSAGING_WEBHOOK_SECRET, key: latest }
            # Error reporting. In Secret Manager rather than as a plain value
            # BECAUSE THIS REPOSITORY IS PUBLIC — a DSN here would be published
            # on GitHub. It only authorises *writing* events, so the exposure is
            # junk data rather than data loss, but there is no reason to hand it
            # out. Absent → the backend runs with NoopErrorReporter and boots
            # normally; it is deliberately not a fail-fast.
            # Design: docs/design/observability-error-reporting.md §4.3.
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef: { name: SENTRY_DSN, key: latest }
            # -- OWNER-SUPPLIED ----------------------------------------------
            # Every one of these WAS a lazy guard: absent, the service still
            # booted green and 500d on the first request that touched it
            # (measured — see infra-gcp-migration.md §3.4), which meant a
            # revision missing all of them passed the deploy verify step below
            # and was promoted to serve traffic. They are now forced at boot
            # (BACKEND.md §3.2.2), so absent means the revision never serves.
            # Shapes were validated before wiring: R2 keys 32/64 chars, buckets
            # are names not URLs, the FCM key keeps its literal \n escapes
            # (dependencies.dart converts them).
            - name: GOOGLE_CLIENT_IDS
              valueFrom:
                secretKeyRef: { name: GOOGLE_CLIENT_IDS, key: latest }
            - name: APPLE_CLIENT_IDS
              valueFrom:
                secretKeyRef: { name: APPLE_CLIENT_IDS, key: latest }
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef: { name: RESEND_API_KEY, key: latest }
            # The outbound-email ceilings, per hour, per class. Declared here at
            # the code defaults rather than left implicit, because the runbook
            # on both budget alert policies tells the operator to "raise
            # EMAIL_BUDGET_COLD in infra/gcp/service.yaml" — and until now the
            # variable was not in this file to raise.
            #
            # The tempting shortcut is wrong twice over: `gcloud run services
            # update --set-env-vars` needs `--container app` here (this service
            # runs the app plus a cloudsql-proxy sidecar), and the deploy uses
            # `services replace`, so a hand edit is reverted by the next deploy.
            # Change it here, deploy, and the value an operator reads is the
            # value in force.
            #
            # cold = an anonymous caller chose the address (OTP: the whole
            # attack surface). warm = an authenticated actor, about their own
            # thing — starving those drops booking confirmations, which is why
            # the two counters never touch.
            # docs/design/backend-email-send-budget.md §5.
            - name: EMAIL_BUDGET_COLD
              value: "60"
            - name: EMAIL_BUDGET_WARM
              value: "1000"
            # The per-identity ceilings, per hour, per identity. Declared
            # here at the code defaults for the same reason the email budgets
            # above are, and after the same defect: the runbook on the
            # per-identity alert pointed an operator at a variable that was not
            # in this file. It then over-corrected and claimed no such variable
            # existed at all — which is worse, because `dependencies.dart` reads
            # all seven, and a console hand-edit does work. It is simply
            # reverted by the next `services replace`, exactly as above.
            #
            # LIMIT_SIGN_REVIEW is not independent: a review carries up to six
            # photos, so raising LIMIT_REVIEW_SUBMIT without raising this
            # re-creates a lockout on a surface the user never approached. A
            # test enforces the relationship.
            # docs/design/backend-identity-rate-limits.md §5.
            - name: LIMIT_BOOKING
              value: "10"
            - name: LIMIT_REVIEW_SUBMIT
              value: "5"
            - name: LIMIT_SIGN_GALLERY
              value: "60"
            - name: LIMIT_SIGN_REVIEW
              value: "40"
            - name: LIMIT_SIGN_KYC
              value: "10"
            - name: LIMIT_SIGN_DEPOSIT
              value: "10"
            - name: LIMIT_SIGN_AVATAR
              value: "10"
            # R2 — all seven together or storageService throws (dependencies.dart:308).
            # R2_ENDPOINT is deliberately NOT set: it is derived from the
            # account id (:141-146), and supplying both invites drift.
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef: { name: R2_ACCOUNT_ID, key: latest }
            - name: R2_BUCKET
              valueFrom:
                secretKeyRef: { name: R2_BUCKET, key: latest }
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: R2_ACCESS_KEY_ID, key: latest }
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: R2_SECRET_ACCESS_KEY, key: latest }
            # Also the gallery's origin allowlist (anti-hotlink). This used to be
            # a SECOND, independent read that bypassed the fail-fast above, so a
            # wrong or absent value left the check off while those routes still
            # returned 200. The allowlist is now derived from the storage service
            # actually in use (`galleryOriginsFor`), so the two cannot disagree.
            - name: R2_PUBLIC_BASE_URL
              valueFrom:
                secretKeyRef: { name: R2_PUBLIC_BASE_URL, key: latest }
            - name: R2_KYC_BUCKET
              valueFrom:
                secretKeyRef: { name: R2_KYC_BUCKET, key: latest }
            - name: R2_DEPOSIT_BUCKET
              valueFrom:
                secretKeyRef: { name: R2_DEPOSIT_BUCKET, key: latest }
            # FCM — only the private key is secret. The other two are public
            # identifiers read from the project, so they are plain config
            # rather than three Secret Manager round-trips.
            # The short commit SHA — which is ALSO the image tag, so a release
            # in Sentry maps to a deployed artifact by inspection.
            #
            # **Not the image reference.** That was the first attempt, and Sentry
            # rejected it: release identifiers may not contain `/`, and an
            # invalid one is DISCARDED rather than refused, so every error
            # grouped under "no release" while the configuration looked correct.
            # Found in the event's "Event Processing Errors" panel, not by
            # anything failing.
            - name: RELEASE
              value: __RELEASE__
            - name: FCM_PROJECT_ID
              value: myweli
            - name: FCM_CLIENT_EMAIL
              value: firebase-adminsdk-fbsvc@myweli.iam.gserviceaccount.com
            - name: FCM_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: FCM_PRIVATE_KEY, key: latest }
            # Seeds the super-admin at boot. ADMIN_PASSWORD is BOOTSTRAP ONLY:
            # the seeder is insert-only, so on a database that already holds the
            # admin this value is read and DISCARDED — changing it here does not
            # rotate anything, and the boot log says so. Rotate through
            # POST /admin/auth/password.
            # docs/design/backend-admin-password-change.md
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: ADMIN_EMAIL, key: latest }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: ADMIN_PASSWORD, key: latest }
          startupProbe:
            tcpSocket:
              port: 8080
            # 30 × 10s = 300s. Migrations, five seeds/backfills, and a possible
            # wait on another instance's advisory lock all happen before the
            # port opens. (The total was right; the factors below were not what
            # this line used to claim.)
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

        # ---- Cloud SQL Auth Proxy sidecar ---------------------------------
        # Chosen over the unix-socket mount because createPool builds from a
        # host:port URL; over private IP because that needs a VPC on day one.
        # DATABASE_URL points at 127.0.0.1:5432, which database.dart:22 maps to
        # SslMode.disable — the proxy encrypts the hop. Zero application change.
        - name: cloudsql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - --structured-logs
            - --port=5432
            # The proxy binds 127.0.0.1 for the DB port, which a Cloud Run TCP
            # startup probe CANNOT reach — measured: the proxy logged "ready for
            # new connections" while the probe failed 24× and the instance was
            # discarded. Its own health-check server is the supported seam, and
            # it must bind 0.0.0.0 to be probeable. Only /startup and /liveness
            # are served there; the database port stays on loopback.
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9090
            - myweli:europe-west9:myweli-db
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            # timeoutSeconds must be < periodSeconds (Cloud Run validation).
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 4
  traffic:
    - percent: 100
      latestRevision: true
