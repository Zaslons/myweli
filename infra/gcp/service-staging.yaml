# Cloud Run service — the MyWeli backend, STAGING.
#
# A real committed file rather than a templated copy of service.yaml. Templating
# `metadata.name` would mean the service's identity is invented at deploy time by
# a shell substitution, which reopens exactly the drift the declarative file
# exists to close — and it is the service NAME that decides whether a deploy
# lands on staging or on production.
#
# **Read this side by side with service.yaml.** Everything not called out below
# is deliberately identical, because a staging environment that differs where it
# did not have to is rehearsing something else. In particular the probes, the
# 300s timeout, the container-dependencies ordering fix and both resource limits
# are copied verbatim: the cold-start path they protect is the one staging
# exercises MOST, since minScale is 0 here.
#
# Deployed by .github/workflows/deploy-backend.yml with `environment: staging`.
# Design: docs/design/infra-staging.md.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: myweli-api-staging
  labels:
    cloud.googleapis.com/location: europe-west9
  annotations:
    # **`all`, unlike production — and not an oversight.** Production is
    # `internal-and-cloud-load-balancing` because a global load balancer is the
    # only front door and the *.run.app URL must not be a second one. Staging has
    # no load balancer (the $18.25/mo hostname is declined — infra-staging.md
    # §4.1), so its run.app URL is the ONLY door. Copying production's value here
    # would make staging unreachable by its own cron and by every Vercel preview,
    # which is the entire reason it exists.
    #
    # This block used to continue: "staging is a publicly reachable service
    # that echoes OTP dev-codes ... so **anyone who finds this URL can sign in
    # as any identity in this database.** That is deliberate", and flagged the
    # prod-copy case as **unresolved before build-order step 5**. Step 5 ran on
    # 2026-08-16 and the deadline passed unnoticed.
    #
    # **Resolved 2026-08-18: the disclosure is gone.** `Env.echoesOtpDevCode` is
    # `dev`-only, so no *deployed* environment returns an OTP — an open ingress
    # no longer implies a signable identity, whatever database is attached, and
    # the prod-copy tension in infra-staging.md §2.1 disappears rather than
    # being managed. Enforced by
    # backend/test/auth/staging_otp_disclosure_test.dart, because a deadline in
    # a design doc demonstrably was not a mechanism.
    #
    # What the open ingress still means: every unauthenticated *read* this API
    # exposes is public here, exactly as on production. That is the intended
    # posture — the cron and every Vercel preview need it.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        # WHAT COMMIT IS THIS REVISION RUNNING? Today that question takes four
        # steps — find the deploy run, read its log, notice whether it PROMOTED
        # a tag or built one, map the tag back to a commit — and it is
        # answerable wrongly. It was: run 32151417428 records
        # headSha=d36fe475 and shipped an image built from b64dda0, because it
        # promoted. Anyone reading the run alone concludes production runs a
        # commit it has never run.
        #
        # A label on the REVISION (not the service) makes the artifact answer
        # for itself, in one command, and keeps answering correctly after a
        # rollback — an old revision reports the commit IT was built from:
        #
        #   gcloud run services describe myweli-api --region europe-west9 \
        #     --format='value(spec.template.metadata.labels.commit)'
        commit: __RELEASE__
      annotations:
        # Its OWN instance, not a second database on production's. The arithmetic
        # is the reason: myweli-db carries no `databaseFlags` at all, so it runs
        # on the db-f1-micro default of 25 connections, and production already
        # budgets 4 × maxScale 4 = 16 of them.
        #
        # This connection name appears TWICE — here and in the proxy's argv
        # below. Both must change together; changing one points the annotation
        # and the proxy at different instances.
        run.googleapis.com/cloudsql-instances: myweli:europe-west9:myweli-db-staging

        # Identical to production, and load-bearing for the same reason: the app
        # opens a real connection during migrations with no retry and no backoff,
        # and the image is FROM scratch so no shell wrapper can wait for the
        # proxy. See service.yaml for the measurement.
        run.googleapis.com/container-dependencies: '{"app":["cloudsql-proxy"]}'

        # **minScale 0, unlike production's 1.** Two reasons, and the second is
        # the better one:
        #   · cost — the Cloud SQL instance already cannot scale to zero and is
        #     54-68% of staging's bill; the compute should not join it;
        #   · fidelity — every staging request then exercises the cold start that
        #     runs migrations behind `pg_advisory_lock` before the port binds.
        #     Production hides that path behind minScale 1. Staging is where it
        #     should be hit constantly, so a migration that is slow enough to
        #     time out fails here rather than during a production deploy.
        autoscaling.knative.dev/minScale: '0'
        # 2 × 4 connections = 8, inside myweli-db-staging's own budget of 25.
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      # **A separate runtime identity, not production's `myweli-run@`.** Reusing
      # it would be cheaper — it already holds project-level
      # `roles/cloudsql.client` — and it would make the secret split below purely
      # cosmetic: `myweli-run@` has `secretAccessor` on every PRODUCTION secret
      # version, so a manifest naming `DATABASE_URL` instead of
      # `STAGING_DATABASE_URL` would simply work. The isolation would then rest
      # on nobody mistyping a YAML key, in a file that is about to be deployed by
      # a push trigger.
      #
      # This account is granted access to the thirteen `STAGING_*` secrets and
      # the four shared ones, and to nothing else. A staging revision that
      # reaches for a production secret fails at revision creation.
      serviceAccountName: myweli-run-staging@myweli.iam.gserviceaccount.com
      timeoutSeconds: 300
      containers:
        # ---- the API ------------------------------------------------------
        - name: app
          image: __IMAGE__
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            # The one value that makes this environment what it is. `guardsOn` is
            # ON (every fail-fast below is boot-fatal, exactly as in production)
            # while `isProd` is OFF, which keeps staging identifiable in logs,
            # headers and Sentry rather than passing for production.
            # **`echoesOtpDevCode` is also OFF** — it is `dev`-only, so this
            # service discloses no OTP. See boot_config.dart.
            - name: ENV
              value: staging
            - name: TZ
              value: UTC
            # **Identical to production, and it must be.** Unset would make
            # `explicit` false, turning ALL four methods on — including phone,
            # which cannot deliver here — and simultaneously silencing the
            # Google/Apple/Resend fail-fasts. Staging would then rehearse an auth
            # surface production does not have.
            - name: AUTH_METHODS
              value: google,apple,email
            - name: MESSAGING_PROVIDER
              value: disabled
            # Not present in service.yaml, because production HAS a Firebase
            # project. Staging does not until it gets its own bundle ids
            # (infra-staging.md §4), and pointing it at production's would put
            # staging pushes on real phones. This is the explicit off switch, so
            # "no push here" stays distinguishable from "someone forgot FCM".
            #
            # The three FCM_* variables are therefore absent from this file
            # entirely — including the private key, which is a credential and has
            # no business being mounted into a second environment.
            - name: PUSH_PROVIDER
              value: disabled
            # **Staging origins only — never production's.** Copying prod's value
            # makes staging accept browser calls from https://myweli.com, and the
            # fix for a CORS-blocked preview is always to add a staging origin,
            # never to widen production's list.
            #
            # Only localhost is listed today because it is the only staging
            # origin that exists. The Vercel preview origins and the
            # myweli-admin-staging Pages origin are added when those are pointed
            # at staging (infra-staging.md build order, step 5) — Vercel mints a
            # distinct hostname per deployment, so that step has to settle how an
            # exact-match allowlist covers them before this value is final.
            - name: WEB_ORIGINS
              value: http://localhost:3000
            # -- SECRETS ------------------------------------------------------
            # `STAGING_*` twins, one per production secret, EXCEPT the four
            # marked SHARED below. Every one of these is boot-fatal
            # (BACKEND.md §3.2.2): a missing value means the revision never
            # serves, which is what makes a staging deploy a real check.
            #
            # A `secretKeyRef` naming a secret that does not exist at all fails
            # even earlier — at revision creation, with no application log.
            #
            # **None of these exist yet.** Creating the thirteen `STAGING_*`
            # secrets, the staging Cloud SQL instance and the
            # `myweli-run-staging@` bindings is build-order step 4, in an
            # `infra/gcp/90-staging.sh` that is NOT YET WRITTEN. Until it runs, a
            # staging deploy fails at revision creation — loudly, and in the
            # safe direction.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: STAGING_DATABASE_URL, key: latest }
            # **The single most important thing on this page not to share.** One
            # value across both environments means a token minted here — and
            # staging is where we deliberately mint admin tokens — authenticates
            # against production.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: STAGING_JWT_SECRET, key: latest }
            # The audience must equal the Scheduler job's, and for staging that
            # is the service's own `*.run.app` URL — a value that did not exist
            # until `90-staging.sh` created the service, which is why this pair
            # landed after the rest of the file.
            #
            # **It is `status.url`, not the other one.** Cloud Run publishes TWO
            # run.app hostnames for one service: `gcloud run services replace`
            # printed `myweli-api-staging-731308991240.europe-west9.run.app`
            # while `status.url` — what the Scheduler jobs were pointed at — is
            # the value below. They must match or the OIDC check fails and
            # `authenticate()` falls through to the shared secret while looking
            # configured, which is the failure this whole pair exists to remove.
            #
            # Production's audience here would be worse than none: it would name
            # a host this service is not.
            - name: CRON_OIDC_AUDIENCE
              value: https://myweli-api-staging-5a24ymhbbq-od.a.run.app
            - name: CRON_SERVICE_ACCOUNT
              value: myweli-scheduler@myweli.iam.gserviceaccount.com
            # Messaging is disabled here, so nothing will ever call the delivery
            # webhook — but unset means the webhook is OPEN (deny-by-default is
            # off when there is no secret to compare), and this service is
            # publicly reachable. Set, therefore, precisely because it is unused.
            - name: MESSAGING_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: STAGING_MESSAGING_WEBHOOK_SECRET, key: latest }
            # SHARED — the same secret, not a twin. `error_reporter.dart` already
            # tags every event with `environment: staging` from the same `Env`
            # the guards use, so both environments belong in one Sentry project:
            # splitting them would split release health for one codebase. A DSN
            # only authorises WRITING events, so there is no access to separate.
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef: { name: SENTRY_DSN, key: latest }
            # SHARED — public OAuth client identifiers, not credentials. They
            # ship inside the app binary and the web bundle. They are an
            # *audience allowlist* for Google-signed ID tokens, so different
            # values would mean staging accepts tokens production rejects, which
            # is the opposite of a rehearsal. Unlike JWT_SECRET this grants no
            # crossover: an ID token replayed at production only authenticates
            # the same Google account its owner could sign in with anyway.
            - name: GOOGLE_CLIENT_IDS
              valueFrom:
                secretKeyRef: { name: GOOGLE_CLIENT_IDS, key: latest }
            - name: APPLE_CLIENT_IDS
              valueFrom:
                secretKeyRef: { name: APPLE_CLIENT_IDS, key: latest }
            # A staging-only Resend key that CANNOT deliver — the placeholder
            # `re_staging_placeholder_delivery_is_disabled`, which satisfies the
            # non-empty boot guard and nothing else. Email is a live channel
            # reaching real inboxes, and §3.3's rule is that staging never has
            # one.
            #
            # **How you sign in here changed on 2026-08-18.** This comment used
            # to end "sign-in still works: `isProd` is false, so the OTP is
            # echoed in the response and nothing needs to arrive" — the echo was
            # what made an undeliverable key safe. The echo is now `dev`-only
            # (it let anyone sign in as anyone, §"ingress" above), so **email
            # sign-in to staging cannot complete**. Use Google or Apple;
            # automation uses the Q1b seam. If a human needs the email path,
            # mount a deliverable key here and accept that §3.3 no longer holds.
            # The Q1b OTP-disclosure seam, mounted HERE and deliberately not
            # on production.
            #
            # **Why staging needs it now, when it did not before.** Until
            # 2026-08-18 staging echoed `devCode` unconditionally, so the funnel
            # harness just read the code out of the response. That echo let
            # anyone who found this public URL sign in as anyone, so it was
            # closed (docs/design/backend-staging-otp-disclosure.md) — and the
            # harness lost its way in. This is the way back, and it is the one
            # the seam was built for.
            #
            # **Two independent conditions, and the second is load-bearing**: a
            # constant-time match on this secret AND an identity in the RFC 2606
            # `.test` TLD, which is a compile-time constant no environment value
            # can widen. A fully leaked secret therefore buys sessions on
            # unroutable throwaways and nothing else — which is what makes
            # mounting a disclosure path on a `ingress: all` service defensible
            # at all.
            #
            # The boot log announces it when active: a disclosure path quietly
            # left enabled is the failure worth engineering against.
            - name: SMOKE_OTP_SECRET
              valueFrom:
                secretKeyRef: { name: STAGING_SMOKE_OTP_SECRET, key: latest }
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef: { name: STAGING_RESEND_API_KEY, key: latest }
            # Set in NEITHER file until now, so both fell back to the same
            # default — meaning anything staging did manage to send would arrive
            # indistinguishable from production mail. Belt and braces with the
            # dead key above: if a real key is ever pasted here by mistake, the
            # message at least announces where it came from.
            - name: EMAIL_FROM
              value: MyWeli STAGING <no-reply@myweli.com>
            # The per-identity ceilings, per hour, per identity. Declared at
            # the code defaults so a staging rehearsal exercises the SAME numbers
            # the production runbook names — a rehearsal against different
            # ceilings proves less than it appears to.
            #
            # (Note EMAIL_BUDGET_COLD/WARM are declared in service.yaml and NOT
            # here, so staging runs the code defaults for those. That divergence
            # predates this block and is left alone rather than changed in
            # passing.)
            #
            # LIMIT_SIGN_REVIEW is not independent: a review carries up to six
            # photos, so raising LIMIT_REVIEW_SUBMIT without raising this
            # re-creates a lockout on a surface the user never approached.
            # docs/design/backend-identity-rate-limits.md §5.
            - name: LIMIT_BOOKING
              value: "10"
            - name: LIMIT_REVIEW_SUBMIT
              value: "5"
            - name: LIMIT_SIGN_GALLERY
              value: "60"
            - name: LIMIT_SIGN_REVIEW
              value: "40"
            - name: LIMIT_SIGN_KYC
              value: "10"
            - name: LIMIT_SIGN_DEPOSIT
              value: "10"
            - name: LIMIT_SIGN_AVATAR
              value: "10"
            # R2 — the whole set together or `storageService` throws. Real
            # staging buckets rather than STORAGE_PROVIDER=disabled: uploads are
            # the riskiest surface here (presigned PUTs, private KYC and deposit
            # buckets) and an unrehearsable upload path is a poor economy.
            #
            # The credential is what matters, not the bucket names: an
            # account-scoped token reads and writes every bucket regardless of
            # what R2_BUCKET says, so STAGING_R2_ACCESS_KEY_ID must be scoped to
            # the three staging buckets — otherwise a staging run of the
            # user-erasure path deletes production objects.
            #
            # If the Cloudflare buckets are not ready, the supported stopgap is
            # `STORAGE_PROVIDER: disabled` INSTEAD of these seven — never a
            # partial set, and never production's values.
            #
            # SHARED: R2_ACCOUNT_ID is the Cloudflare account id, so a staging
            # twin would be byte-identical and two copies of one value is drift
            # waiting to happen.
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef: { name: R2_ACCOUNT_ID, key: latest }
            - name: R2_BUCKET
              valueFrom:
                secretKeyRef: { name: STAGING_R2_BUCKET, key: latest }
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: STAGING_R2_ACCESS_KEY_ID, key: latest }
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: STAGING_R2_SECRET_ACCESS_KEY, key: latest }
            # Also the gallery's origin allowlist, derived from the storage
            # service in use (`galleryOriginsFor`). Pointing this at production's
            # CDN would have staging trust production URLs and reject its own.
            - name: R2_PUBLIC_BASE_URL
              valueFrom:
                secretKeyRef: { name: STAGING_R2_PUBLIC_BASE_URL, key: latest }
            - name: R2_KYC_BUCKET
              valueFrom:
                secretKeyRef: { name: STAGING_R2_KYC_BUCKET, key: latest }
            - name: R2_DEPOSIT_BUCKET
              valueFrom:
                secretKeyRef: { name: STAGING_R2_DEPOSIT_BUCKET, key: latest }
            # The short commit SHA, substituted by the deploy workflow. Sentry
            # then groups staging and production errors from the same build under
            # one release, which is what makes "it worked in staging" checkable.
            - name: RELEASE
              value: __RELEASE__
            # Separate credentials, because this is the account that can suspend
            # salons and read KYC — and staging is where we hand it out.
            # STAGING_ADMIN_PASSWORD is BOOTSTRAP ONLY: the seeder is
            # insert-only, so on a database that already holds the admin this
            # value is read and DISCARDED — changing it here rotates nothing,
            # and the boot log says so. Rotate through POST /admin/auth/password.
            # docs/design/backend-admin-password-change.md
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: STAGING_ADMIN_EMAIL, key: latest }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: STAGING_ADMIN_PASSWORD, key: latest }
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

        # ---- Cloud SQL Auth Proxy sidecar ---------------------------------
        - name: cloudsql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - --structured-logs
            - --port=5432
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9090
            # The second of the two places the instance is named. See the
            # cloudsql-instances annotation above.
            - myweli:europe-west9:myweli-db-staging
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 4
  traffic:
    - percent: 100
      latestRevision: true
