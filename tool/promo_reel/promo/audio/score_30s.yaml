  - {id: strike1.slash, kind: pen_slash, pos: 2.1.0, gain: -8}
  - {id: strike2, kind: log, pos: 2.1.3, note: C2, vel: 0.8, gain: -3}                                  # « Raturé. » f76
  - {id: strike2.slash, kind: pen_slash, pos: 2.1.3, gain: -8}
  - {id: strike3, kind: log, pos: 2.2.2, note: C2, glide_from: G1, vel: 0.85, decay: 0.5, gain: -3}      # « Recopié. » f88; its sub rings into the AIR
  - {id: strike3.slash, kind: pen_slash, pos: 2.2.2, gain: -8}
  - {id: riser1, kind: riser, pos: 2.1.0, end: 2.3.3, gates: [[2.1.0, 8], [2.3.0, 16]], gain: -11}   # f64-108
  - {id: clap_roll1, kind: clap_roll, pos: 2.3.0, end: 2.3.3, rate: 16, gain: -6}             # f96 f100 f104
  - {id: air1.reverse, kind: reverse, pos: 2.4.0, end: 3.1.0, gain: -20}             # « Respirez. » f112 -> f128 (-16 left AIR 1 5.8 LU under on the master)
  # ── DROP 1, bar 3 (f128-191) ────────────────────────────────────────────
