  - {id: riser2, kind: riser, pos: 8.3.0, end: 8.4.3, gates: [[8.3.0, 8], [8.4.0, 16]], gain: -11}   # f480-508
  - {id: lift.reverse, kind: reverse, pos: 8.4.0, end: 9.1.0, gain: -15}             # DRUM STOP f496 -> f512
  # ── DROP 2, bar 9 (f512-575) ────────────────────────────────────────────
  - {id: drop2.impact, kind: impact, pos: 9.1.0, f_start: 70, f_end: 35, tau: 0.5, rt60: 0.9, noise_db: -8, wet_db: -10, gain: -6}
  - {id: drop2.whip, kind: whoosh, style: whip, pos: 9.1.0, peak: 3, gain: -14}      # crest f515
  - {id: revenus.touch, kind: click, pos: 9.2.0, gain: -3}                          # « Mois » touch-down f528
  - {id: revenus.tick1, kind: tick, pos: 9.2.2, gain: -4}                           # the roll f536-544
  - {id: revenus.tick2, kind: tick, pos: 9.2.3, gain: -4}
  - {id: revenus.tick3, kind: tick, pos: 9.3.0, gain: -4}
  - {id: revenus.land, kind: log, pos: 9.3.1, note: C2, octave: true, vel: 1.0}     # the counter lands f548: N1's wait (0.663 s) at 0.995x
  - {id: revenus.ding, kind: kalimba, pos: 9.3.1, note: C6, gain: -10}
  # ── DROP 2, bar 10 (f576-639) ───────────────────────────────────────────
  - {id: sentence.word1, kind: log, pos: 10.1.0, note: Ab1, vel: 1.0}               # « Chaque » f576
  - {id: sentence.word2, kind: log, pos: 10.1.2, note: C2}                          # « rendez-vous » f584
  - {id: sentence.word3, kind: log, pos: 10.2.0, note: Eb2}                         # « terminé, » f592
  - {id: sentence.word4, kind: log, pos: 10.2.2, note: Ab2, vel: 1.0}               # « compté. » f600
  - {id: sentence.pop, kind: pop, pos: 10.2.2, gain: -4}                            # the card lands f600
