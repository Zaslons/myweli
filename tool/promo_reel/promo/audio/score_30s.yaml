  - {id: slot.touch, kind: click, pos: 5.2.2, gain: -3}                             # « Libre » touch-down f280
  - {id: slot.push, kind: whoosh, style: swish, pos: 5.2.3, offset: 2, dur: 10, gain: -18}   # form pushes in f286
  - {id: slot.rest, kind: log, pos: 5.4.0, note: Eb2, vel: 1.0}                     # form at rest f304 (+ Rhodes stab)
  # ── GROOVE B, bar 6 (f320-383): the stepped time-lapse ───────────────────
  - {id: fill.touch1, kind: click, pos: 6.1.0, gain: -3}                            # « Coupe homme » f320
  - {id: fill.tape, kind: whoosh, style: tape, pos: 6.1.0, offset: 2, dur: 12, gain: -17}    # f322-334
  - {id: fill.touch2, kind: click, pos: 6.2.0, gain: -3}                            # « Client sans numéro » f336
  - {id: fill.touch3, kind: click, pos: 6.3.0, gain: -3}                            # name field f352
  - {id: fill.key1, kind: key, pos: 6.3.2, gain: -4}                                # Y  f360
  - {id: fill.key2, kind: key, pos: 6.3.3, gain: -4}                                # a  f364
  - {id: fill.key3, kind: key, pos: 6.4.0, gain: -4}                                # o  f368
  - {id: fill.key4, kind: key, pos: 6.4.1, gain: -4}                                # space f372
  - {id: fill.key5, kind: key, pos: 6.4.2, gain: -4}                                # K  f376
  - {id: fill.key6, kind: key, pos: 6.4.3, gain: -4}                                # .  f380
  # ── LOG BREAK, bar 7 (f384-447) ─────────────────────────────────────────
  - {id: create.drag, kind: whoosh, style: swish, pos: 7.1.0, dur: 8, gain: -18}    # form scroll f384-392
  - {id: create.touch, kind: click, pos: 7.2.0, gain: -3}                           # « Créer le rendez-vous » f400
