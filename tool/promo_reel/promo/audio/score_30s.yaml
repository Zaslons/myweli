  - {id: create.chime, kind: chime, pos: 7.4.1, note: G5, gain: -11, reverb: 1.2, wet: -14}
  - {id: create.strike, kind: pen_slash, pos: 7.4.2, gain: -8}                      # « libre » struck f440
