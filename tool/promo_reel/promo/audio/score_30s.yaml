  - {id: swipe.open, kind: log, pos: 3.3.0, note: Eb2, vel: 1.0}                    # pane open, f160
  - {id: swipe.open_wood, kind: thock, pos: 3.3.0, gain: -4}
  - {id: tap.touch, kind: click, pos: 3.4.0, gain: -3}                              # tap touch-down f176
  - {id: tap.close, kind: whoosh, style: close, pos: 3.4.2, dur: 6, gain: -14}      # pane closes f184-190
  # ── DROP 1, bar 4 (f192-255) ────────────────────────────────────────────
  - {id: arrive.log, kind: log, pos: 4.3.2, note: F2, vel: 1.0}                     # badge « Arrivé », lift f232
  - {id: arrive.pop, kind: pop, pos: 4.3.2, gain: -4}
  - {id: arrive.answer, kind: log, pos: 4.4.1, note: C2}                            # f244
  - {id: arrive.air, kind: whoosh, style: air, pos: 4.4.2, offset: 2, end: 5.1.0, gain: -14}   # f250 -> the whip
  # ── GROOVE B, bar 5 (f256-319) ──────────────────────────────────────────
