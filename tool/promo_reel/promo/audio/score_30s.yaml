# MyWeli Pro promo « CARNET → DROP » — the 30-s score (15 bars, 960 frames, 32.0 s).
#
# Bar 15 is the owner's added bar (2026-10-19, « Add one bar »): the end card holds ≈ 4.3 s over a
# calm one-bar outro — the log drum and a thinning shaker, the underline's pen on the downbeat, a last
# short chord with the last log on beat 3 that RINGS OUT before the end: released after 3 16ths, the
# last log at the default decay with a short room, the pad faded out — ≥ 20 dB under its hit by f950
# and about −48 dBFS over the last 100 ms, so the master's 60-ms end fade never chops a loud tail
# (review round 3: the chord held to the last sample, 5.5 dB of decay over the last second; verify (d)
# holds every cut's last hit to it).
#
# Written around the storyboard's hero frames (promo-storyboard-full.md, « Beat by
# beat (30 s) » and « Music plan »): a log or kick lands on every hero frame first
# — as a CUE, which SCENES addresses by id — and each phrase fills from log
# pattern A (steps 0 3 6 10 11 14) or B (0 6 9 12). Format: SCORE.md.
# Frames in the comments: frame = (bar-1)*64 + (beat-1)*16 + step*4.

score: 1
cut: 30s
bars: 15
tempo: 112.5
key: C minor
swing: 0.56            # shakers and hats only

sections:
  - {name: hook, bars: 1-2}          # f0-127, no kick; AIR f112-127
  - {name: drop1, bars: 3-4}         # f128-255
  - {name: groove_b, bars: 5-6}      # f256-383, congas + rimshots in
  - {name: log_break, bars: 7}       # f384-447, Rhodes and clap out
  - {name: lift, bars: 8}            # f448-511, drum stop at f496
  - {name: drop2, bars: 9-11}        # f512-703, whistle, organ, congas
  - {name: breakdown, bars: 12}      # f704-767, AIR f752-767
  - {name: reveal, bars: 13}         # f768-831, pad + sub only
  - {name: end_card, bars: 14}       # f832-895, the mark, the tagline, the stores, myweli.com
  - {name: outro, bars: 15}          # f896-959, the owner's added bar: calm, then the end

chords:
  1: Cm9
  3: Cm9
  4: F9          # f192
  5: Abmaj9      # f256
  6: G7b9        # f320
  7: Cm9
  8: F9
  9: Cm9         # drop 2
  10: Abmaj9
  10.3.0: G7b9   # f608
  11: Cm9
  11.3.0: F9     # f672, the public page's scroll
  12: F9
  13: Cm9
  14: Cm9
  15: Cm9

patterns:
  four:           "x...|x...|x...|x..."
  backbeat:       "....|x...|....|x..."
  sixteenths:     "xxxx|xxxx|xxxx|xxxx"
  sixteenths_air: "xxxx|xxxx|xxxx|...."       # stops for an AIR beat
  offbeats:       "..o.|..o.|..o.|..o."
  hats16:         "xgox|xgox|xgox|xgoX"       # bar 6: hats move to 16ths
  conga_a:        "....|h..l|..s.|h..."       # steps 4 7 10 12
  conga_b:        "..h.|.l.h|..s.|.l.h"       # bars 9-11: counterpoint
  rim_a:          "....|...x|....|.g.x"
  # log drum: degrees of the bar's chord (1 3 5 7 8 9; "," an octave down)
  log_a:          "1! . . 1 | . . 5, . | . . 7, 1 | . . 3 ."     # A: 0 3 6 10 11 14
  log_b:          "1! . . . | . . 8 . | . 7 . . | 5 . . ."       # B: 0 6 9 12
  keys:           "..X-|-...|..x-|.x--"       # Rhodes stabs after beat 1
  keys_hero:      "..X-|-...|....|X---"       # + the stab on beat 4 (f304, f560)
  organ_a:        "...x|..x.|....|x-.."
  hold:           "X---|----|----|----"
  hold_split:     "X---|----|X---|----"       # re-voiced at a mid-bar chord change

tracks:
  log:
    instrument: log
    gain: -10
    bars:
      3: "1! . . 1 | . . 5, . | . . . 1 | . . 3 ."   # A without step 10: the hero E♭2 sits on step 8
      4: "1! . . . | . . 8 . | . 7 . . | . . . ."    # B; heroes on 10 and 13 (cues)
      5: log_b                                       # B; step 12 is the hero (cue slot.rest)
      6: log_a
      7: "1! . . 1 | . . 3 . | 5, . 7, 1 | . . . E2"  # the solo line of the log break; E2 leads to F2
      8: ". . . . | . . . . | . . . . | 5, . 1 3"    # heroes on 0 6 8 10 (cues); the log runs on through the stop
      9: "1! . . 1 | . . 5, . | . . . 1 | . . 3 ."   # A without step 10: the landing is the cue on step 9 (f548)
      10: ". . . . | . . . . | . . 7, 1 | . . 3 ."   # words on 0 2 4 6 (cues), then A's tail
      11: log_b
      12: "1 . . . | . . . . | . . . . | . . . ."    # breakdown; the tail on 12.3.0 is a cue
      14: ". . . . | . . . . | . . . . | . . . ."    # the end card: its three hits are cues (f832, f848, f880)
      15: "1 . . . | . . . . | . . . . | . . . ."    # the outro's downbeat (the underline); the last log is a cue

  kick:
    instrument: kick
    gain: -7                                        # under the log
    bars:
      3-7: four
      8: "x...|x...|x...|...."                      # DRUM STOP at f496
      9: "x...|x...|xx..|x..."                      # + the punch under the landing (f548)
      10-11: four
      12: "x...|....|....|...."                     # thins from f704, gone from f736
      14: "X...|....|....|...."

  clap:
    instrument: clap
    gain: -1
    bars:
      3-6: backbeat
      8: "X...|....|....|...."                      # « rempli. » (f448); f464 is the cue fiche.cut
      9: "....|x...|.X..|x..."                      # + the landing (f548)
      10-11: backbeat
      12: "....|x...|....|...."
      14: "X...|....|....|...."

  shaker:
    instrument: shaker
    gain: -16
    pan: 0.25
    swing: true
    humanise: 5
    automation:
      gain: [[1.1.0, -4], [2.4.0, -4], [3.1.0, 0], [15.1.0, 0], [15.3.0, -7]]   # the hook is darker; the outro thins
    bars:
      1: sixteenths
      2: sixteenths_air
      3-7: sixteenths
      8: sixteenths_air                             # out at the drum stop
      9-11: sixteenths
      12: sixteenths_air
      14: sixteenths
      15: "x.x.|x.x.|x...|...."                     # thinning: 8ths, then the last two

  hat:
    instrument: hat
    gain: -10
    pan: -0.25
    swing: true
    humanise: 3
    bars:
      3-5: offbeats
      6: hats16
      8: "..o.|..o.|..o.|...."
      9-11: offbeats
      12: "..o.|..o.|....|...."
      14: offbeats

  conga:
    instrument: conga
    gain: -10
    pan: -0.35
    bars:
      5-6: conga_a
      9-11: conga_b

  rim:
    instrument: rim
    gain: -6
    pan: 0.3
    bars:
      5-6: rim_a
      9-11: rim_a

  rhodes:
    instrument: rhodes
    gain: -17
    reverb: 1.4
    wet: -16
    automation:
      lp: [[1.1.0, 600], [1.3.0, 600], [1.4.0, 1200], [2.4.0, 1200], [3.1.0, 14000]]
      gain: [[1.1.0, -6], [2.4.0, -6], [3.1.0, 0], [11.4.0, 0], [12.1.0, -4], [12.4.0, -4], [14.1.0, -2]]
    bars:
      1: hold                                       # the hook's Cm9 pad, low-passed 600 Hz
      2: "x---|----|----|...."
      3-4: keys
      5: keys_hero
      6: keys
      8: "..X-|-...|....|...."
      9: keys_hero
      10: "..X-|-...|X-..|.x--"                     # A♭maj9, then G7♭9 from step 8
      11: keys
      12: "X---|----|----|...."
      14: "..X-|----|----|----"
      15: "....|....|x--.|...."                     # the last chord, with the last log (f928), released: it rings out

  organ:
    instrument: organ
    gain: -8
    bars:
      9-11: organ_a

  whistle:
    instrument: whistle
    gain: -15
    pan: 0.2
    reverb: 1.6
    wet: -12
    bars:
      9:  ". . G5 - | - . Bb5 - | - . C6 - | - . Bb5 -"
      10: "- . C6 - | - . Bb5 - | - . Ab5 - | - . G5 -"
      11: "- . Eb6 - | - . D6 - | - . C6 - | - . A5 -"

  pad:
    instrument: pad
    gain: -14
    automation:
      gain: [[1.1.0, -3], [2.4.3, -3], [3.1.0, 0], [12.3.3, 0], [12.4.0, -40], [12.4.3, -40], [13.1.0, 5],
             [14.1.0, 5], [14.2.0, 0], [15.1.0, 0], [15.3.0, -8], [15.4.2, -40]]
      # AIR 1's breath 3 dB down; muted over AIR 2 (f752-767); fades OUT over the outro (gone before the end). Both AIRs ≥ 7 LU under the
      # groove ON THE MASTER (verify (d), the master and the MP4): 8.5 / 8.5 LU as written
    bars:
      2: "....|....|....|X---"                      # the AIR's breath of pad
      3-6: hold
      8-9: hold
      10-11: hold_split
      12: "X---|----|----|...."
      13-14: hold
      15: "X---|----|----|--.."                     # released 2 16ths before the end, on its fade

  sub:
    instrument: sub
    gain: -14
    bars:
      13: hold

cues:
  # ── HOOK, bar 1 (f0-63) ─────────────────────────────────────────────────
  - {id: hook.stab, kind: log, pos: 1.1.0, note: C2, vel: 1.0, lp: 600, decay: 0.3, gain: -2}   # f0: never silent
  - {id: hook.word1, kind: rim, pos: 1.1.0}                                         # « Votre » f0
  - {id: hook.word2, kind: rim, pos: 1.1.2}                                         # « carnet » f8
  - {id: hook.word3, kind: rim, pos: 1.2.0}                                         # « déborde ? » f16
  - {id: hook.pen, kind: pen_scratch, pos: 1.1.0, end: 1.2.2, gain: -16}            # the entry inking f0-24
  - {id: hook.cut, kind: log, pos: 1.3.0, note: G1, vel: 0.8, gain: -3}                                 # f32 hard cut to the macro
  - {id: hook.cut_rim, kind: rim, pos: 1.3.0}
  - {id: hook.margin, kind: pen_scratch, pos: 1.4.0, gain: -12}                     # f48, 180 ms
  # ── HOOK, bar 2 (f64-127): the three strikes, riser 1, AIR ───────────────
