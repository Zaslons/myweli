# MyWeli Pro promo « CARNET → DROP » — the one source of the reel.
#
# Approved storyboard (2026-10-19): every number below is taken from it —
# « GRID AND NOTATION », « LAYOUT 9:16 », « 1:1 and 16:9 » and « Safe zones ».
# The schema is checked by promo/storyboard.py (README « storyboard.yaml »):
# meta, cuts and formats strictly; music (AUDIO) and scenes (SCENES) are
# passed through, except that every cue a scene names must be in music.cues.
# Pixels are [x0, y0, x1, y1] on the format's canvas; positions are
# bar.beat.step from the cut's start (promo/timebase.py).

meta:
  title: "MyWeli Pro — « CARNET → DROP »"
  fps: 30                 # beat = 16 frames, 16th = 4, bar = 64 (2.1333 s)
  bpm: 112.5
  key: C minor            # Cm9 / F9 / A♭maj9 / G7♭9
  sample_rate: 48000      # 1 frame = 1 600 samples

cuts:
  # The owner's decision after the first 30-s review (2026-10-19, « Add one bar »): each cut gets ONE bar
  # more than its name holds, a calm outro, so the end card's full wording holds ≈ 4.3 s and reads at
  # ≤ 17 cps (verify (i)). storyboard.py allows exactly that one bar past the name, never more.
  30s:
    bars: 15
    frames: 960           # 32.0 s = 14 bars (29.867 s) + the outro bar; past the historical 30-s Status cap (the owner's call)
    description: the full story — hook, drop 1, booking, Fiche, drop 2 (Revenus), public page, reveal, end card, outro
  15s:
    bars: 8
    frames: 512           # 17.067 s = 7 bars + the outro bar — its own score (re-scored, never spliced) and its own events.json
    description: one-bar hook, the swipe and tap, a booking made, Revenus, reveal, end card, outro

# Every format's short side is 1080, so type, the phone scale (1.791 px/pt),
# the touch disc, the lifts and the Lottie keep the same pixel sizes
# everywhere: each format is re-laid out, never cropped or resized.
#
# ONE storyboard → three formats (storyboard « 1:1 and 16:9 »): the scenes
# say WHAT is shown and WHEN; each format's `layout` says WHERE — the caption
# placement, the counter, where each kind of lift lands, the hook's page and
# its scrim, the map credit. The scenes' camera W values are measured in the
# `reference` format (9:16); each W key says what it keeps (`keep: top` — the
# point on the window's top edge, e.g. a row hidden under the band; `centre`
# — the active row in the window's middle; `floor` — a row on the floor), and
# the other formats re-frame by that rule (promo/scenes/phone.py).
x-type-px: &type_px       # (YAML anchor only — the key below each format is what is read)
  hook: 96                # Poppins Medium, white
  app: 72                 # Poppins Medium #1A1A1A, ≤ 2 lines, every line measured
  counter: 120            # Poppins Medium figure
  counter_label: 40       # Inter Medium #4A4A4A
  tagline: 46             # end card, ONE line
  store: 40               # « Sur l’App Store et Google Play », Inter Medium #4A4A4A (≥ 40: read, not fine print)
  site: 40                # « myweli.com », the end card's last line, Inter Medium #1A1A1A (≥ 40)
  credit: 24              # « © OpenStreetMap contributors · © CARTO » (the app's own), Inter #6E6E6E

formats:
  9x16:
    reference: true                       # the scenes' camera W values are measured in this window
    size: [1080, 1920]
    safe: [120, 270, 900, 1248]
    safe_basis: platform
    safe_note: >-
      Strict combined text rectangle, the worst case of TikTok, Reels and
      WhatsApp Status (780×978). Text, lifts and the counter stay at
      y ≤ 1248 and x ≤ 900 whenever below y 840.
    # The owner's 9:16 FLOOR (2026-10-19, « Extend to ~y 1450 »): the phone window runs down to y 1424 (≈ 1450, set
    # by the pictures: Fatou B.'s card bottom, 582 pt, 11 px above the floor and the old 13:15 row's text 20 px under
    # the floor fade, with the band edge between « Ma journée » and « Aujourd’hui » — README « The formats »).
    phone_window_note: >-
      The owner's 9:16 floor (2026-10-19): app pixels only below y 1248 — the
      demonstrated UI and the touch discs that ride it; text, captions, the
      counter and the lifts stay inside the platform rectangle (y ≤ 1248).
    rail_free: [120, 270, 960, 840]   # above y 840 the right button rail has not started: captions may run to x 960
    zones:
      caption_band: [0, 0, 1080, 560]     # opaque stage behind the captions
      caption_fade: [0, 560, 1080, 600]
      captions: [150, 300, 930, 540]      # centred on x 540, ≤ 780 px wide (x 150–930)
      hook_block: [150, 300, 930, 700]    # the hook's 96-px block and strike stack
      phone_window: [180, 600, 900, 1424] # every demonstrated UI element lives here (app pixels only below 1248)
      overlays: [120, 270, 900, 1248]     # lifts, the counter
      floor_fade: [0, 1424, 1080, 1448]
      floor: [0, 1448, 1080, 1920]        # calm stage colour + pattern under the platform chrome
    layout:
      caption_band: true
      caption_column_x: [150, 930]
      caption_centre_x: 540
      caption_centre_y: null              # words sit from the band's top (y 300–540)
      caption_line_max_px: 771
      caption_lines_max: 2
      phone_screen_x: [180, 900]          # capture cropped from screen pt 56, 720 px wide
      px_per_pt: 1.791
      screen_crop_top_pt: 56
      phone_bezel_px: 16                  # generic slab: no notch, no buttons
      phone_radius_px: 96
      type_px: *type_px
      lottie_centre: [540, 680]           # wordmark ink ≈ x 180–896, y 619–754
      lottie_comp_width_px: 900           # 0.833 × the short side
      end_mark_scale: 1.2
      end_mark_ink_y: [400, 599]
      end_tagline_cap_top_y: 712          # one line, 762 px (x 159–921), above y 840
      lift_x: [120, 900]                  # lifted cards 780 px wide
      lift_veil: 0.55                     # the phone recedes under a 55 % paper veil
      lift_path: straight                 # a lift travels straight from its place (one whose place lies outside the
                                          # text rectangle pops in place: Fatou B. on the owner's floor, review round 5)
      tilt_axis: x                        # 2.5D tilts are rotX
      tilt_max_deg: null
      scene_whip_axis: null               # whips follow the storyboard row (vertical in-phone, horizontal onto Revenus)
      zoom_pivot_x: null                  # a push-in scales about the phone's own axis
      phone_anchor: null                  # the band edge is fixed (y 600)
      caption_align: centre
      caption_cap_top: {hook: 300, app: 330}   # the hook block y 300–700; app words y 300–540
      counter_baselines: [322, 496]       # label, figure: the label clear of the rolling band above the figure
      lift_y:                             # where each kind of lift lands (its x: lift_x)
        # « Arrivé »: Fatou B.'s card (on the floor, y ≈ 1284–1413) lifts UP into the platform rectangle
        card_on_floor: {bottom: 1236}
        card_under_caption: {centre_y: 930}   # « Total réalisé », under the two-line sentence
        tile_row: {centre_y: 815}         # the Fiche's three tiles, on their own row (y 725–875)
      hook_page: {x: [40, 1040], top: 640, pivot: [540, 1250], macro_to: [540, 1200]}   # the page fills y ≈ 700–1700, tilted
      hook_scrim: {rect: [0, 0, 1080, 520], fade: [0, 120]}   # black over the page to y 520, gone by 640: no scribble under the words
      # the floor is the phone's now (to y 1424): the band's foot, its ink ending on the screen's right edge (x 900),
      # over the map it credits — as 1:1's (round 3 put it on the floor, x 120, baseline 1236: over the app's pixels now)
      map_credit: {x: 900, baseline: 552, align: right}

  1x1:
    size: [1080, 1080]
    safe: [54, 54, 1026, 1026]
    safe_basis: ebu_r95_graphics
    safe_note: EBU R95 graphics-safe, 5 % inset.
    rail_free: null
    zones:
      # the band edge at the journal's chip row (review round 4: at y 330 the band's fade cut the week's dates on
      # Fatou B.'s framing — the window top allowed by the floor rule fell on them): band to 358, fade to 388
      caption_band: [0, 0, 1080, 358]
      caption_fade: [0, 358, 1080, 388]
      captions: [54, 80, 1026, 340]       # at most two 72-px lines; counter label + 120-px figure fit in 230 px
      hook_block: [54, 54, 1026, 420]     # captions and the strike stack in the band (its third line reaches y ≈ 414)
      phone_window: [180, 388, 900, 1002] # ≈ 343 pt visible
      overlays: [54, 54, 1026, 1026]      # lifts may grow past the phone edges
      floor_fade: [0, 1002, 1080, 1026]
      floor: [0, 1026, 1080, 1080]
    layout:
      caption_band: true
      caption_column_x: [54, 1026]
      caption_centre_x: 540
      caption_centre_y: null
      caption_line_max_px: 771
      caption_lines_max: 2
      phone_screen_x: [180, 900]
      px_per_pt: 1.791
      screen_crop_top_pt: 56
      phone_bezel_px: 16
      phone_radius_px: 96
      type_px: *type_px
      lottie_centre: [540, 520]
      lottie_comp_width_px: 900
      end_mark_scale: 1.2
      end_mark_ink_y: [250, 449]
      end_tagline_cap_top_y: 560
      lift_x: [150, 930]                  # 780 px like 9:16 (the lifts keep their pixel size), centred; they may use x 54–1026
      lift_veil: 0.55                     # no side room: the phone still recedes under the veil
      lift_path: straight
      tilt_axis: x
      tilt_max_deg: null
      scene_whip_axis: null
      zoom_pivot_x: null
      phone_anchor: null
      caption_align: centre
      caption_cap_top: {hook: 80, app: 120}    # app words y 120–275 (two 72-px lines), the band's middle
      # label + 120-px figure in the band (label ink y ≥ 81 while it switches, figure ink 200–286): the figure ends
      # 72 px over the band's fade (y 358; round 3: 17 px over the phone's bezel); the roll fades out by the band's
      # edge instead of being cut there (review round 3)
      counter_baselines: [120, 284]
      lift_y:
        card_on_floor: {bottom: 1000}     # the window's floor (1002)
        card_under_caption: {centre_y: 690}
        tile_row: {centre_y: 588}         # the tiles' own row at W 216 (y 513–663)
      # the page fills the square under the band, smaller than 9:16's (840 px wide, not 1000) so its three strike
      # rows land inside the graphics-safe area (y ≈ 549–994, review round 3: at 1000 px wide the third was drawn
      # below the frame, y 1117–1159); the macro's margin note at x ≈ 96–190, inside it too
      hook_page: {x: [120, 960], top: 10, pivot: [540, 600], macro_to: [540, 760]}
      hook_scrim: {rect: [0, 0, 1080, 400], fade: [0, 100]}   # the strike stack's third line needs the band to y ≈ 414
      # the floor is outside the safe area: the band's foot, its ink ending on the screen's right edge (x 900),
      # right over the map it credits (round 3: ending on x 1026, over the bezel's corner, it read as the caption's)
      map_credit: {x: 900, baseline: 346, align: right}

  16x9:
    size: [1920, 1080]
    safe: [96, 54, 1824, 1026]
    safe_basis: ebu_r95_graphics
    safe_note: EBU R95 graphics-safe, 5 % inset. No caption band.
    # The owner's 16:9 « Re-lay it » (2026-10-19): larger captions for the feed — the column's 72-px words at 88 px
    # (the longest line, « Chaque rendez-vous », 942 px in the 960-px column), the counter at 144 / 48
    type_note: >-
      The owner's 16:9 re-lay (2026-10-19): larger captions for feed
      legibility — app captions 88 px (72 × 1.22, the column's width), the
      counter 144 px with its 48-px label; the hook's words, the end card's
      lockup and the credit keep the storyboard's sizes.
    rail_free: null
    zones:
      captions: [96, 54, 1040, 1026]      # left column, the block centred on y 440; same two-line breaks
      hook_block: [96, 54, 816, 520]      # captions and strike stack top-left, on the hook's scrim
      # right third, the phone standing on the floor (layout.phone_anchor): ≈ 526 pt visible when the screen fills
      # the window — taller than round 3's 512 pt —, the band edge coming down over the rows above W wherever the
      # screen ends inside it (the lower journal: the old 13:15 row under the band, the slab's bottom on y 1026)
      # the screen x 1088–1808: the slab's bezel ends ON the graphics-safe edge (x 1824; review round 5: at x 1104–1824
      # the bezel ran to 1840, and to 1860 in the drop's slam, past action-safe)
      phone_window: [1088, 54, 1808, 1026]
      top_fade: [1088, 54, 1808, 84]      # the band's 30-px fade at its resting edge (y 84)
      # lifts pop out to the LEFT of the phone, no veil — at the left column's full width where it helps (the owner's
      # round 5, 2026-10-20: the « Arrivé » card and the Fiche's tiles, x 96–1040)
      overlays: [96, 54, 1044, 1026]
      slot_card: [96, 560, 620, 1026]     # SLOT « FAUTEUIL » (bars 11–12): EMPTY — no photos (the owner); the caption alone
      floor_fade: [0, 1026, 1920, 1050]   # app pixels only past the safe edge (the screen filling the window)
      floor: [0, 1050, 1920, 1080]
    layout:
      caption_band: false
      caption_column_x: [96, 1040]        # 32 px clear of the bezel (x 1072)
      caption_centre_x: null
      caption_centre_y: 440
      caption_line_max_px: 944           # 771 × 88 / 72: the 72-px rule at the 16:9 captions' 88 px
      caption_lines_max: 2
      phone_screen_x: [1088, 1808]
      px_per_pt: 1.791
      screen_crop_top_pt: 56
      phone_bezel_px: 16
      phone_radius_px: 96
      type_px: {<<: *type_px, app: 88, counter: 144, counter_label: 48}   # type_note: the owner's larger captions
      lottie_centre: [960, 500]
      lottie_comp_width_px: 900
      end_mark_scale: 1.2
      end_mark_ink_y: [230, 429]
      end_tagline_cap_top_y: 540          # tagline centred
      lift_x: [284, 1044]                 # 760 px, 28 px clear of the bezel (x 1072)
      lift_veil: 0.0
      # out of the phone BESIDE the sentence: down first, then across under it — never across the caption (review
      # round 5: the « Total réalisé » card crossed « rendez-vous » and grazed « terminé, » in flight)
      lift_path: under
      tilt_axis: y                        # 2.5D tilts become yaw moves
      tilt_max_deg: 10
      scene_whip_axis: horizontal         # the bar-5 in-phone whip stays vertical inside the window
      # a push-in scales about the slab's RIGHT edge, on the safe edge: the phone grows leftwards, so it never
      # passes x 1824 (review round 3: about the phone's axis the FAB and the snackbar reached x 1835 at the
      # « rempli. » push's peak) — and, where it stands on the floor, about the floor (review round 5)
      zoom_pivot_x: 1824
      # the phone stands on the floor (the owner's « Re-lay it », 2026-10-19): its screen's bottom never rises above
      # y 1010 (the slab's bottom on the floor, y 1026) — the band edge comes down instead (fx.phone.Window)
      phone_anchor: floor
      caption_align: left                 # the column's left edge, x 96
      caption_cap_top: {hook: 130, app: null}  # the hook top-left; app captions centred on y 440
      counter_baselines: [354, 561]       # 48 / 144 px: the counter's block (ink y 317–563) centred on the column's y 440
      lift_y:                             # beside the phone, under the caption (y ≈ 395–490)
        # the owner's round 5 (2026-10-20): the « Arrivé » card at the left column's full width — 944 px, 1.42× the
        # card in the phone (round 5: 760 px, 1.15×), « Arrivé » read at 50 %; 16:9 lifts are exempt from « same
        # pixel size everywhere » (the owner)
        card_on_floor: {bottom: 1000, x: [96, 1040]}
        # the card's top 60 px under the two 88-px lines' ink (review round 5: at 770 its top edge was 22 px under
        # « compté. »'s descender); y ≈ 596–1004, on the floor's side of the safe edge
        # « Total réalisé » keeps lift_x (760 px): at the column's 944 px it would be 508 px tall — under the
        # two-line sentence (ink to y ≈ 523) and inside the safe floor (1026) there are 427 px: it cannot grow
        card_under_caption: {centre_y: 800}
        tile_row: {centre_y: 720, x: [96, 1040]}   # the Fiche's three tiles across the column (304 px each; were 243)
      hook_page: {x: [760, 1960], top: -440, pivot: [1360, 560], macro_to: [1340, 640]}   # the page across the frame's right, rows 9–18 in view
      hook_scrim: {rect: [0, 0, 820, 1080], fade: [200, 0],   # black down the left, the words top-left on it
                   # the macro shot (f32–63): black behind the question only (its ink y ≈ 130–330), gone by y 540, so
                   # the margin note writes itself in view (x ≈ 710–845, y ≈ 710–778; review round 3: under the black)
                   macro: {rect: [0, 0, 820, 400], fade: [200, 140]}}
      map_credit: {x: 1040, baseline: 1016, align: right}     # at the foot of the left column, by the phone's corner


# ── MUSIC ─────────────────────────────────────────────────────────────────────
# ONE source of cue ids: the scores. Each cut's music IS its score (AUDIO,
# promo/audio/SCORE.md): the cue ids a scene addresses (`cue:swipe.touch`) are
# that score's `cues[].id`, checked by promo/storyboard.py. The renderer renders
# the score FIRST and reads every time from the events.json it writes (where
# each sound actually landed), never from a number written here.
music:
  scores:
    30s: promo/audio/score_30s.yaml
    15s: promo/audio/score_15s.yaml

# ── SCENES ────────────────────────────────────────────────────────────────────
# One list per cut; each scene is a stretch of picture, in order, end to end.
# The renderer (promo/render.py, promo/scenes/) reads everything from here, so a
# variant is a --set, never a code change. `rows` are the storyboard's « Beat by
# beat (30 s) » rows 1–24 in the 30-s cut, and the « BAR n » of « The 15 s cut »
# in the 15-s one.
#
# THE 15-s CUT reuses the 30-s blocks it shares through YAML anchors and merges
# (`<<: *end_card` = « the 30-s end scene, with these keys changed »): the AIR,
# Revenus, the reveal and the end card are the 30-s's own, re-timed by the 15-s
# score's events.json (the same cue ids), and the old 13:15 row's hiding rule
# and the « Arrivé » lift are the same data. promo/storyboard.py loads every use
# as its own copy, so a --set on one cut never changes the other.
#
# TIMES (film): `cue:<id>` (where the score's sound landed, from events.json),
#   `cue:<id>@end` (a span's end), either with `+N` / `-N` frames; a grid
#   position `bar.beat.step` (`5.2&` reads too), also with ±N; `end` = the cut's end.
# TIMES (take): seconds of the take as written (an instant inside a held picture,
#   e.g. 10.000); {named: t} the picture whose time is written t to the
#   millisecond (takes.index_named); {touch: gesture} the measured touch-down
#   (promo.media.touches: first changed picture − 200 ms); {first_change: g};
#   {key: type-nom[n]} a typed key's first picture.
# TIMELINE: segments from `at` on — `hold` a take time; or `src` at `rate`
#   (default 1) until `src_until` (then held); or `src` … `until` (film) /
#   `src_until` (take), the rate derived (it is checked never to exceed the
#   gesture ramps the storyboard allows); `at: chain` starts where the previous
#   segment reached its src_until; `pick: scroll` picks pictures by their
#   measured scroll on a cosine instead of by time (take5b, storyboard R3).
#   `blur: N` accumulates N subframes, each with its own take picture.
#   `dissolve: <take time>` + `until` + `cite`: a DECLARED dissolve from the
#   picture on screen to that later picture (on `curve`, default the app's
#   base easeInOut), the footage between skipped — each picture through the
#   camera W of its own end of the dissolve (W keys at `at` and `until`).
# CAMERA: keyframes {at, value, curve}; a key is reached at `at`, from the
#   previous key on `curve` (linear, ease_out_cubic, ease_in_out_cubic,
#   fast_out_slow_in, ease_in, ease_out, ease_in_cubic). W = the screen point on
#   the window's top edge (the band edge, y 600 in 9:16), measured in the
#   reference format (9:16); `keep: top | centre | floor` (default: the key
#   before it's, the first `top`) says what the value holds — a point on the
#   top edge, in the window's middle, on the floor — and the other formats
#   re-frame by it (never below the screen's top, pt 56). zoom = px_per_pt ÷
#   1.791 about `anchor_pt` (a screen point) or `anchor_y: top` (the window's
#   top edge); rot_x in degrees — a tilt, turned into the format's
#   `tilt_axis` (16:9: yaw, ≤ 10°); `blur` on a key blurs the move into it
#   (`whip` = a 6-frame whip).
# PLACES: a lift lands at the format's `lift_x`, its `target.y` naming one of
#   the format's `lift_y` places; the stacked tiles likewise (`layout.y`); the
#   counter on the format's `counter_baselines`; the map credit on its
#   `map_credit`; the hook's page on its `hook_page`; a caption with
#   `centre: frame` is centred on the canvas (the AIR's word).
# GENERATED ELEMENTS cite their source (`cite:`); verify lists every one.

scenes:
  30s:

  # ── rows 1–4 · f0–111 · HOOK: the code-drawn carnet ──────────────────────────
  - id: hook
    rows: [1, 2, 3, 4]
    kind: carnet
    from: cue:hook.stab
    to: cue:air1.reverse                    # HARD CUT to the AIR on 2.4
    stage: {ground: black, pattern: 0.4, drift_px_s: [0, -4]}
    grain: {seed: 11}
    cite: "generated illustration of a common pain: procedural ruled paper, unreadable pen scribbles, no font, no name, no number (storyboard row 1; promo/fx/carnet.py); brand pattern per the brand book (Identity p.13 / Brandbook p.22)"
    carnet:                                 # where the page lies: the format's hook_page (9:16: y ≈ 700–1700, tilted)
      seed: 7
      rot_x: 22
      push: {from: cue:hook.stab, to: 2.2.3+3, scale: [1.10, 1.16]}     # linear, already under way at f0
      macro: {at: cue:hook.cut, until: cue:strike1, rot_x: 16, scale: 1.7,
              focus_entry: squeeze, focus_offset: [230, 40]}   # HARD CUT on 1.3 and back on 2.1, the entry on hook_page.macro_to
      sink: {from: cue:clap_roll1, frames: 16, scale: [1.0, 1.5], light: [1.0, 0.15], blur: 8}   # 2.3: push + sink, motion-blurred
      ink:
        - {entry: write, from: cue:hook.pen, to: cue:hook.pen@end, start: 0.3}    # 30 % drawn at f0, complete at f24
        - {entry: margin, from: cue:hook.margin, frames: 8}                        # the margin note writes itself
      strikes:                              # rows relative to the entry being written
        - {row: -7, cue: strike1}
        - {row: -3, cue: strike2}
        - {row: 2, cue: strike3}
      punch: {peak: 1.025, cues: [strike1, strike2, strike3]}
    captions:
      - id: hook-question
        type: hook
        until: cue:strike1
        cite: "hook copy, approved storyboard 2026-10-19 (« Votre carnet déborde ? »)"
        lines:
          - [{w: Votre, at: cue:hook.word1}, {w: carnet, at: cue:hook.word2}]
          - [{w: "déborde ?", at: cue:hook.word3}]
      - id: hook-stack
        type: hook
        line_height: 120
        until: cue:air1.reverse
        cite: "hook copy, approved storyboard 2026-10-19"
        lines:
          - [{w: Rayé., at: cue:strike1}]
          - [{w: Raturé., at: cue:strike2}]
          - [{w: Recopié., at: cue:strike3}]

  # ── row 5 · f112–127 · AIR ──────────────────────────────────────────────────
  - &air1
    id: air1
    rows: [5]
    kind: air
    from: cue:air1.reverse
    to: cue:drop1.impact
    stage: {ground: black, pattern: 1.0, drift_px_s: [0, -4]}
    cite: "brand pattern per the brand book; no UI"
    captions:
      - id: breathe
        type: hook
        centre: frame                       # centred on the canvas, every format
        until: cue:drop1.impact
        cite: "hook copy, approved storyboard 2026-10-19"
        lines: [[{w: Respirez., at: cue:air1.reverse}]]

