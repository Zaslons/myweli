    from: cue:reveal.impact                  # HARD CUT to #FAFAFA, no pattern
    to: cue:reveal.glide@end
    stage: {ground: paper, pattern: 0}
    lottie: {file: mobile/assets/lottie/open/myweli_loader_mixed_pro.json, colour: "#111111"}
    cite: "mobile/assets/lottie/open/myweli_loader_mixed_pro.json as pro_splash_screen.dart:45 and :212-219 play it; content unchanged, retimed per segment"
    warp:                                    # film → comp frame, piecewise linear
      - [cue:reveal.impact, 0]
      - [cue:reveal.shimmer, 12]             # 0.90×: « MyWeli Pro » fades in
      - [cue:reveal.shimmer+12, 38]          # the static hold, shortened (13.2.3, f796)
      - [cue:reveal.glide, 48]               # 1.50×: the letters fade
      - [cue:reveal.glide@end, 72]           # 1.44×: M and W glide together into the mark
    blur: {from: cue:reveal.glide, to: cue:reveal.glide@end, samples: 8}

  # ── row 24 · f824–959 · END: the mark settles, the tagline, the store line, the outro ──
  - &end_card
    id: end
    rows: [24]
    kind: end_card
    from: cue:reveal.glide@end
    to: end
    # no cut: the mark keeps easing up from where the reveal left it (comp 72, the same place) — a scene
    # handoff, not a join (review round 3: the plan called it a cut; the MP4 changes by 0.07 levels there)
    transition: {kind: continuous}
    stage: {ground: paper, pattern: 0}
    lottie: {file: mobile/assets/lottie/open/myweli_loader_mixed_pro.json, colour: "#111111", comp: 74}
    cite: "the finished mark is the Lottie's comp 74 (= comp 142), only moved and scaled"
    mark:
      from_comp: 72                          # where the reveal left it
      settle: {at: cue:end.mark, frames: 8, curve: ease_out_cubic}   # eases up and settles on 14.1
      # on the last log (15.3.0, f928) a small punch — the outro's second calm event, 1.6 s before the end;
      # moved and scaled only, its ink stays clear of the tagline by more than half its height
      punch: {at: cue:end.last, peak: 1.06, out: 3, back: 8}
    captions:
      - id: tagline
        type: tagline
        reveal: mask
        until: end
        cite: "the brand book's Pro tagline (not a statistic); fallback « Votre journée, heure par heure. » (screens.json still 01)"
        # ONE quick reveal as the mark settles: the 6-frame mask runs f827→f832, whole on the mark's landing
        # (cue end.mark); the mark's ink is above y 652 by f827, clear of the line (cap top 712)
        lines: [[{w: "Plus de clients, moins de gestion.", at: cue:end.mark-5}]]
        # the outro's downbeat (f896): the hook's strike — the brand's single round-cap stroke — comes back as an
        # underline under « moins de gestion. », drawn left to right with the pen on its cue; under the
        # descenders, clear of the store line (the renderer refuses a stroke that touches any text)
        underline: {text: "moins de gestion.", at: cue:end.underline, frames: 8}
      # the owner's end card (2026-10-20, « Both stores, post later »): the mark · the tagline · the stores · the site,
      # each line alone on its own beat-grid cue; 34 + 30 + 10 = 74 characters f827→f960 = 16.7 cps (≤ 17).
      # POSTING GATE (README): the films are posted only once BOTH the iOS and the Android Pro apps are live.
      - id: store
        type: store
        reveal: mask
        until: end
        cite: "the owner's decision (2026-10-20, « Both stores, post later »; architecture contract « Owner decision — end card stores + site »): « Sur l’App Store et Google Play » replaces « Disponible sur l’App Store » — posted only once BOTH the iOS and the Android Pro apps are live in their stores (README, POSTING GATE)"
        lines: [[{w: Sur l’App Store et Google Play, at: cue:end.store}]]  # alone on its own cue, f848 (15-s f400)
      - id: site
        type: site
        reveal: mask
        until: end
        cite: "the owner's decision (2026-10-20): « myweli.com », the last line — true today (the site serves 200 and is where salons choose their offer)"
        lines: [[{w: myweli.com, at: cue:end.site}]]                       # alone on its own cue, f880 (15-s f432)

  15s:

  # ── BAR 1 · f0–47 · HOOK: the code-drawn carnet, one bar ─────────────────────
  # The 30-s rows 1–4 in one bar (storyboard « The 15 s cut », BAR 1): no macro
  # cut, no strike words (reading time), no sink — three strikes with their
  # punches on the log hits f24 / f32 / f40, straight into the AIR.
  - id: hook
    rows: [1]
    kind: carnet
    from: cue:hook.stab
    to: cue:air1.reverse                    # HARD CUT to the AIR on 1.4
    stage: {ground: black, pattern: 0.4, drift_px_s: [0, -4]}
    grain: {seed: 11}
    cite: "generated illustration of a common pain: procedural ruled paper, unreadable pen scribbles, no font, no name, no number (storyboard « The 15 s cut », BAR 1; promo/fx/carnet.py); brand pattern per the brand book (Identity p.13 / Brandbook p.22)"
    carnet:
      seed: 7
      rot_x: 22
      push: {from: cue:hook.stab, to: cue:air1.reverse-1, scale: [1.10, 1.13]}   # the 30-s push's speed (1.10 → 1.16 over f0–95), under way at f0
      ink:
        - {entry: write, from: cue:hook.pen, to: cue:hook.pen@end, start: 0.3}  # 30 % drawn at f0, complete at f24
      strikes:                              # the 30-s rows, on the 15-s log hits
        - {row: -7, cue: strike1}
        - {row: -3, cue: strike2}
        - {row: 2, cue: strike3}
      punch: {peak: 1.025, cues: [strike1, strike2, strike3]}
    captions:
      - id: hook-question
        type: hook
        until: cue:air1.reverse             # held to f47: 22 characters in 1.6 s
        cite: "hook copy, approved storyboard 2026-10-19 (« Votre carnet déborde ? »)"
        lines:
          - [{w: Votre, at: cue:hook.word1}, {w: carnet, at: cue:hook.word2}]
          - [{w: "déborde ?", at: cue:hook.word3}]

  # ── BAR 1 · f48–63 · AIR: the 30-s's own ─────────────────────────────────────
  - <<: *air1
    rows: [1]

  # ── BARS 2–4 · f64–255 · DROP: « Ma journée », take1b — the swipe and tap, a booking made ──
  - id: journal
    rows: [2, 3, 4]
    kind: phone
    from: cue:drop1.impact                  # HARD CUT black → paper; no slam: the camera already sits at W 257
    to: cue:drop2.impact
    stage: {ground: paper, pattern: 1.0}
    take: take1b
    masks: []                               # take1b shows only the « Téléphone du client » placeholder
    hidden: *hidden_1315                    # the same rule, on every frame of the scene: whip, push, dissolve and pop
    timeline:
      - {at: cue:swipe.touch, src: {touch: swipe-arrive}, until: cue:swipe.open, src_until: 11.265, blur: 4}   # 1.11×: the pane open on 2.2 (f80)
      - {at: cue:swipe.open, src: 11.265, rate: 1}   # the pane holds open, at 1×: the finger lifts at its own time (11.420 s, f84.7)
                                            # on take1b's ONE picture 11.265–22.018 s, so the seamless cut on f88 (11.532 → 21.818) shows the same picture
      - {at: cue:tap.touch, src: {touch: tap-arrive}, until: cue:arrive.log, src_until: {named: 23.620}}   # seamless cut 11.595 → 21.818; 0.965×: « Arrivé » on 3.2 (f144)
      - {at: cue:arrive.log, hold: {named: 23.620}}                            # badge « Arrivé »
      - {at: cue:whip1, hold: 31.600}                                          # idle 23.985–32.165
      - {at: cue:slot.touch, src: {touch: tap-libre}, rate: 1, src_until: 32.998}   # 1×: the form pushes in f174–183.5, at rest from f184
      - {at: 4.1.0+1, dissolve: 130.262, until: cue:create.touch, curve: ease_in_out,
         cite: "the App Store film's own declared dissolve 32.998 → 130.262 (« the form, opened → the form, filled »: tool/app_store_preview/storyboard-scenes.json S2, build/app-store/pro/preview/v2/final/cuts.txt) on AppMotion.base's easeInOut (mobile/lib/core/theme/motion.dart:33-34), over f193–196 (storyboard « The 15 s cut », BAR 4); it skips the form fill (the 30-s cut's rows 11–13)",
         # 16:9 (the owner's round 5, 2026-10-20): a HARD CUT on f193 instead — each picture stands on the floor in its
         # own window, and a 3-frame blend of two windows ghosts the fields; the same declared skip
         formats: {16x9: {curve: cut}}}
      - {at: cue:create.touch, src: {touch: tap-creer}, until: cue:create.done, src_until: {named: 131.448}}  # 0.986×, never faster
      - {at: cue:create.done, src: {named: 131.448}, rate: 1}                   # « Rendez-vous créé », 1×
    camera:
      W:
        - {at: cue:drop1.impact, value: 128, keep: floor}    # Fatou B.'s card bottom (582.0 pt) on y 1413; the 13:15 row under the floor (as the 30-s)
        - {at: cue:whip1, value: 128}
        - {at: cue:whip1+6, value: 667, curve: ease_in_out, blur: whip, keep: top}   # vertical whip (the 30-s's curve and rule): the 13:15 row crosses inside the blur and lands under the band
        - {at: 4.1.0+1, value: 667}             # the form at rest, through W 667: « Client sans numéro », the name and the note fields
        # the dissolve re-frames (storyboard: « W 660 − Δ », Δ ≈ 128): measured on the two pictures, the
        # fields from « Client sans numéro » down moved up 145.33 pt (the 125.33-pt scroll + the 20-pt
        # « 0/10 » line the switch took away; NCC 0.9998 on the note field) — W 667 − 145.33 keeps them in place
        # 16:9 (the owner's round 5): the cut needs no fields kept in place, and W 521.67 would bring the band edge
        # down 260 px over the still form on f204–216 (a curtain): the filled form is framed at once by the journal's
        # window (W 667, the push about the floor held) — « Note », « Total 5 000 FCFA », « Créer le rendez-vous » —
        # and nothing moves until the snackbar's push
        - {at: cue:create.touch, value: 521.67, formats: {16x9: {value: 667}}}
        - {at: 4.1.3, value: 521.67, formats: {16x9: {value: 667}}}   # « Créer le rendez-vous » at y ≈ 1158 while its loader shows
        - {at: 4.2.2, value: 667, curve: ease_in_out_cubic, blur: 8}   # back to W 667 over f204–216: the 13:15 row under the band before the journal returns
      zoom:
        - {at: cue:create.done, value: 1.0, anchor_y: top}
        - {at: 4.4.0+12, value: 1.1167, curve: ease_in_out_cubic, anchor_y: top}   # push-in 1.791 → 2.0 px/pt f232–252, pt 667 kept on the band edge
      # 16:9 (the owner's round 5): the push about the floor, its window growing with it, onto the « Libre » tap's
      # form (3.3.2 → 3.4.2) and held to the whip — the form's end, the cut, « Créer », the journal's return; the
      # « rempli. » push on top. 1.23: « rempli. » (x ≤ 1024, ink to y 505) keeps 12 px clear of the phone
      formats:
        16x9:
          fill:
            - {at: cue:slot.touch, value: 1.0}
            - {at: 3.4.2, value: 1.23, curve: ease_in_out_cubic}
    readable:
      - {<<: *create_button, from: cue:create.touch, to: 4.2.3-1}    # the pop starts 131.017 → f218.9
      - *snackbar
    touches:                                 # the App Store film's disc (tool/app_store_preview/frames.py draw_touch :212-219)
      - {gesture: swipe-arrive, at: cue:swipe.touch, tone: dark}      # black on the white card
      - {gesture: tap-arrive, at: cue:tap.touch, tone: light}         # white on the dark-green pane
      - {gesture: tap-libre, at: cue:slot.touch, tone: dark, release_by: 3.3.3+1}   # held 0 ms: gone by f173, before the form pushes in on f174
      - {gesture: tap-creer, at: cue:create.touch, tone: light}       # white on the black button, the frame the dissolve is whole
    lifts:
      - <<: *arrive_card                    # the same real card, on the 15-s « Arrivé » (f144)
        down: 3.2.2+2                       # settles back f154–159, before the whip on f160 (storyboard: « UI lift … f144–159 »)
    captions:
      - id: arrive
        until: cue:whip1
        cite: "pro_journal_screen.dart:284-352 (a Slidable: the swipe reveals « Arrivé », the tap calls journal.arrive)"
        lines:                              # 38 characters over 3.2 s
          - [{w: Une cliente, at: cue:drop1.impact}, {w: "arrive ?", at: 2.1.2}]
          - [{w: "Glissez,", at: cue:swipe.open}, {w: appuyez., at: cue:tap.touch}]
      - id: filled
        until: cue:drop2.impact
        cite: "pro_journal_screen.dart:208, :260 (the « Libre — 14:45 » row is replaced; the 15 minutes left fall under the 30-minute rule)"
        lines: [[{w: Créneau, at: cue:whip1}, {w: libre, at: cue:slot.touch}, {w: rempli., at: cue:create.filled}]]   # 21 characters over 3.2 s
        strike: {word: libre, at: cue:create.strike}
        # « Créneau libre » waits 2.67 s for « rempli. »: centred meanwhile (round 3: 136 px left of centre), it
        # glides left to make room over f235–239 — « libre » struck on f236 as it goes — and « rempli. » rises
        # into its place on f240: the finished line exactly as approved
        recentre: 4

  # ── BAR 5 · f256–319 · « Revenus », take N1: the 30-s's, the counter alone ───
  - <<: *revenus
    rows: [5]
    to: cue:reveal.impact                   # HARD CUT to the reveal: no sentence, no « Total réalisé » lift
    counter: {<<: *revenus_counter, exit: null}   # the counter holds to the cut (lands on f292, N1's wait at 0.995×)
    lifts: []
    captions: []

  # ── BAR 6 · f320–375 · BRAND REVEAL: the 30-s's, on the 15-s cues ────────────
  - <<: *reveal
    rows: [6]

  # ── BARS 7–8 · f376–511 · END: the 30-s's card — tagline, store line, the outro's underline (f448) and punch (f480)
  - <<: *end_card
    rows: [7, 8]
