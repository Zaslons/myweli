  /providers/{id}/journal:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [journal]
      summary: The journal day view in ONE payload (module journal J1)
      description: >
        Provider-authenticated + ownership-scoped (threat T41). Hours/breaks
        for the weekday (null when closed/blocked), the artist columns, and
        the day's appointments (ALL statuses, ascending) enriched with
        salonClientId / clientDisplayName / clientNoShowCount / arrivedAt.
        OWN-SCOPE callers (Collaborateur, `journal.view.own` — T40, access R4a)
        receive their own artist's column and bookings only, and BOTH
        `clientPhone` AND `clientDisplayName` are masked on any day other than
        today (the same-day contact rule; A13 widened it to the name, because a
        member browsing days they do not work would otherwise rebuild the salon's
        client list one date at a time). The `date`
        names a calendar day in the SALON's timezone (multi-pays MP1).
        Design: docs/design/journal-j1-grid.md.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: date, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalDay' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{id}/arrive:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [journal]
      summary: « Client arrivé » (journal J2) — stamp arrivedAt
      description: >
        Provider-only + ownership. CONFIRMED bookings, on their calendar day
        (UTC) only; idempotent (repeat → 200 with the same state). Wrong
        state/day → 409 (`invalid_state` / `not_today`). Threat T43.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The updated appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not confirmed, or not its calendar day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /appointments:
    get:
      tags: [appointments]
      summary: List the caller's appointments (B-appt)
      description: >
        Role-scoped: a **user** token returns that user's own bookings **plus
        provider-entered (manual) bookings made to the account's OTP-verified
        phone** (auto-sync, FR-APPT-008 — the match phone is resolved
        server-side, never from the request); a **provider** token returns the
        bookings of the salon it acts in (owner link or active membership).
        OWN-SCOPE members (Collaborateur, `journal.view.own` — T40, access
        R4a) get their own artist's bookings only, with `clientPhone` and
        `clientDisplayName` (A13) masked off-day. A provider account with no salon and no active membership
        gets 403. R6: a provider `?salonId=` selects among the caller's
        ACTIVE memberships (invalid → uniform 403, T55).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, cancelled, completed, noShow]
        - { $ref: '#/components/parameters/SalonSelector' }
      responses:
        '200':
          description: The caller's appointments (own, or the salon's for a provider)
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [appointments]
      summary: Book an appointment — created pending, server-priced (B-appt)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, serviceIds, appointmentDateTime]
              properties:
                providerId: { type: string }
                serviceIds:
                  type: array
                  items: { type: string }
                appointmentDateTime: { type: string, format: date-time }
                artistId: { type: string }
                notes: { type: string }
                depositScreenshotUrl:
                  type: string
                  description: >
                    Optional Mobile Money proof attached at create time. Must be
                    a key just returned by `POST /uploads/sign?purpose=deposit`
                    — i.e. `pending/deposit/{userId}/…` under the CALLER's own
                    prefix, with no `.`/`..`/empty path segment. The server
                    size-verifies it (T61) and PROMOTES it out of `pending/`,
                    storing `deposit/{userId}/…`; the response carries the
                    promoted key. Anything else → 400 `invalid_input`, and no
                    appointment is created. Attaching or replacing the proof
                    after the fact goes through
                    `POST /appointments/{id}/deposit`.
              description: >
                total/deposit/balance are NOT accepted from the client — the
                server computes them from the provider's prices + deposit policy.
      responses:
        '201':
          description: The created (pending) appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400':
          description: >
            `invalid_input` — a missing/blank required field, a wrong-typed body
            value, or a `depositScreenshotUrl` that is not a freshly-signed key
            under the caller's own deposit prefix. `upload_too_large` /
            `upload_not_found` / `storage_unavailable` — the attached proof
            failed claim-time verification (T61); the booking is not created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            `slot_unavailable` — the requested time isn't a free slot
            (closed/past/break/already-booked/non-aligned).
            `beyond_horizon` — the date is further ahead than the salon's
            `bookingHorizonDays` (A14d). `too_soon` — the start is inside the
            salon's `minimumNoticeMinutes`. The last two are distinct from
            `slot_unavailable` on purpose: that code makes every client say
            some version of "someone else just took your slot", which is false
            for a window breach and leaves the user retrying a time that can
            never be offered.
            `provider_not_published` — the salon has never gone live, so it is
            absent from discovery and reachable only by a stale link or a
            favourite. `provider_suspended` — the salon was stopped. These two
            are split for the same reason as the pair above, and the split
            matters more here: a client cannot tell them apart for itself
            (the mobile `Provider` model has no `status` field), and the
            never-published case is the state EVERY salon starts in while the
            suspended one takes a deliberate admin act.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /appointments/{id}:
    get:
      tags: [appointments]
      summary: One of the caller's appointments (B-appt)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: The appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{id}/cancel:
    post:
      tags: [appointments]
      summary: Cancel the caller's own appointment (B-life)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: The cancelled appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not in a cancellable state (already cancelled/completed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /appointments/{id}/deposit:
    post:
      tags: [appointments]
      summary: Attach a deposit-payment screenshot (B-deposit)
      description: >
        Consumer-only, and only the caller's **own** booking while it is still
        `pending` (pay-later: book now, pay the salon directly via Mobile Money,
        attach proof afterward — booking can also include the key inline). The
        `screenshotKey` must be one the caller just uploaded via
        `POST /uploads/sign?purpose=deposit` (validated under the caller's own
        `deposit/{userId}/` prefix). Myweli holds no funds; the salon confirms
        receipt by **accepting** the booking. The screenshot is private — view it
        via `GET /appointments/{id}/deposit-screenshot`.


        The object is **size-verified at claim time** — R2 does not enforce the
        size signed at upload time, so this is where the cap holds (threat model
        T61). Errors: `upload_too_large` (400, and the object is deleted),
        `upload_not_found` (400, no object behind the key),
        `storage_unavailable` (**503**, the check could not run — the claim is
        deliberately refused rather than accepted, and the identical request is
        worth re-sending; `Retry-After` says when). The first two are the
        caller's to fix; the third is ours, which is why it no longer shares
        their status.


        This block previously documented 502 while the code answered 400 — the
        contract and the implementation disagreed, and neither matched the
        other doc. All three now say 503.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screenshotKey]
              properties:
                screenshotKey:
                  type: string
                  description: Key from `/uploads/sign?purpose=deposit`.
      responses:
        '200':
          description: The updated appointment (with the screenshot attached)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not in a state that accepts a deposit (not `pending`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /appointments/{id}/deposit-screenshot:
    get:
      tags: [appointments]
      summary: A signed view URL for the deposit screenshot (B-deposit)
      description: >
        Returns a short-lived **signed GET** URL for the booking's deposit
        screenshot. Restricted to the two parties to the transaction: the
        booking's **consumer** (`userId`) or its **salon** (the provider
        account's linked `providerId`) — anyone else gets 403. The bytes live in
        private storage and are never served through the API. 404 if no
        screenshot has been attached.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: A short-lived signed URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{id}/review:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [reviews]
      summary: Review a completed appointment (B-reviews)
      description: >
        Consumer-only. The appointment must be the caller's own and `completed`
        (→ 403 `forbidden`/`not_completed`). The server derives provider, artist,
        service, reviewer, and `verified` from it; only `rating`/`text`/
        `photoUrls` are taken from the body. One review per appointment (resubmit
        replaces). Recomputes the provider's + artist's rating.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                text: { type: string, maxLength: 1000 }
                photoUrls:
                  type: array
                  maxItems: 6
                  items: { type: string, maxLength: 2048 }
      responses:
        '201':
          description: The stored review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /appointments/{id}/reschedule:
    post:
      tags: [appointments]
      summary: Move an appointment to a new time (B-life; B-pro-resched)
      description: >
        Role-aware: a `user` reschedules their own booking; a `provider`
        reschedules one of its acting salon's bookings (membership-resolved;
        the service cross-checks the appointment's salon → 403 cross-salon).
        R6: `?salonId=` selects the acting salon among ACTIVE memberships.
        Both re-validate the new slot (→ 409 slot_unavailable for
        past/closed/taken). Deposit + balance carry over unchanged.
        A14d: the salon's bookable window binds the CLIENT's reschedule but
        not the salon's own — the same principle that exempts salon-entered
        bookings from the slot engine, so a salon can always move a booking it
        already accepted, including one grandfathered past a horizon it has
        since shortened.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/SalonSelector' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newDateTime]
              properties:
                newDateTime: { type: string, format: date-time }
                artistId:
                  type: string
                  description: >
                    PROVIDER ONLY (journal J1 drag-across-columns): reassign
                    the booking's artist; must belong to the salon → else 400
                    `invalid_artist`.
      responses:
        '200':
          description: The rescheduled appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Not in a reschedulable state, the new slot is taken, or the salon is
            no longer taking bookings (`provider_not_published` /
            `provider_suspended` — Decision C; the caller owns the booking, so
            the state is named rather than flattened). **Decision-A parity:**
            the SALON's own reschedule is exempt from the visibility gate as it
            is from the booking window — a draft salon owns its calendar — but a
            SUSPENDED one is refused, matching `bookManual`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /appointments/{id}/accept:
    post:
      tags: [appointments]
