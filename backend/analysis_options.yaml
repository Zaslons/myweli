include: package:lints/recommended.yaml

analyzer:
  exclude:
    # `dart_frog build` generates this and COPIES `lib/` into it, so every file
    # is analysed twice and the generated entrypoint trips 374 lints that no
    # one can fix. It is gitignored, so CI never saw it — but Q1 makes
    # `dart_frog build` a routine local step (backend/README.md), and a bare
    # `dart analyze` after one used to look catastrophic for no reason.
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # dart_frog dynamic routes are idiomatically named `[id].dart`, which the
    # default file_names lint rejects. Bracket filenames are framework convention.
    file_names: ignore

linter:
  rules:
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
