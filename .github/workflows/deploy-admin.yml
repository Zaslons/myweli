name: Deploy admin console

# Builds the Flutter-Web admin console (lib/main_admin.dart) and deploys it to
# Cloudflare Pages (project: myweli-admin). The console calls api.myweli.com
# DIRECTLY from the browser, so the backend must allowlist https://admin.myweli.com
# in WEB_ORIGINS — which lives in infra/gcp/service.yaml, not render.yaml; the
# Render Blueprint was superseded by the GCP migration. Restrict the Pages site
# with Cloudflare Access (email allowlist) — the backend also enforces admin
# authz.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID
#
# **Manual trigger only, deliberately** — matching deploy-backend.yml, so that
# "deploys to production" has one shape in this repo.
#
# It used to fire on every push to main touching `mobile/**`, and had done so 89
# times, every one a production deploy. That was tolerable while the console was
# the only thing built from `mobile/`, and stops being tolerable the moment
# staging exists: `API_BASE_URL` below is hardcoded to production, so merging a
# staging-targeted mobile change would still ship a console wired to the real
# API. The deploy is not the risk — the console is internal and behind
# Cloudflare Access — the *silence* is.
#
# **Verified 2026-08-19, and it is true**: an anonymous fetch of
# admin.myweli.com redirects to cloudflareaccess.com and serves the Access
# sign-in. LAUNCH.md §4 carries the evidence. It had gone unchecked for
# months while three files stated it as fact — including one that used it as
# the reason to leave a security control weaker than it should have been.
#
# **It covers this Pages site ONLY.** The API is a different origin on a
# different provider, and an anonymous POST to api.myweli.com/admin/auth/login
# answers 401 directly, no redirect. So this must never again be cited as a
# reason to weaken a backend control:
# docs/design/backend-admin-login-throttle.md §1.
#
# Removing the trigger removed the only thing that compiled `main_admin.dart`,
# so `ci.yml` now builds it on every PR (without deploying). Does-it-compile and
# ship-it are separate questions, and only the second needs a human.
#
# Pointing this at a staging Pages project is phase 8 of
# docs/design/infra-staging.md, when `myweli-admin-staging` exists.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

# Never let two deploys race to publish the same project.
concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — the dispatch must be confirmed
        if: github.event.inputs.confirm != 'deploy'
        run: |
          echo "::error::Type 'deploy' in the confirm input to run this."
          exit 1

      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable

      - name: Build admin web bundle
        working-directory: mobile
        run: |
          flutter pub get
          flutter build web --release \
            --target lib/main_admin.dart \
            --dart-define=USE_API_BACKEND=true \
            --dart-define=API_BASE_URL=https://api.myweli.com

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true # no-op once the project exists
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create myweli-admin --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy mobile/build/web --project-name=myweli-admin --branch=main
