name: Schedule probe — does an hourly tick arrive on time?

# **A three-day experiment, then deleted.** B19.1 of
# docs/design/infra-production-checks-on-time.md (§3.2), decisions 266 and 271.
#
# WHY. production-checks.yml's `cron: '0 6 * * *'` was created by GitHub on time
# until 2026-08-26, then 3.7 to 11.9 hours late every day (§2.1). Another
# public repository's 10-minute schedule arrived at 06:13–06:19 on the days ours
# came at 13:47–16:52 (§3.1). If GitHub's delay falls on infrequent schedules,
# an hourly tick arrives about on time here too, and B19.2 can make the first
# tick after 06:00 UTC the one that runs the checks. This measures that, and
# nothing else.
#
# WHAT IT TOUCHES: nothing. No permission, no checkout, no secret, no alarm, no
# issue; the dead-man check (infra/ci/99-verify-monitor-alive.mjs) reads
# production-checks.yml only. Its whole output is the list of its own runs.
#
# WHAT IS READ, after three days (spec §3.2), per day:
#   - when the first tick after 06:00 UTC was created;
#   - the largest gap between ticks;
#   - how many runs were cancelled while pending.
# B19.2 goes ahead if, each day, the first tick after 06:00 was created by
# 07:00 UTC.
#
# NO `workflow_dispatch`, on purpose: a manual run would sit in the same list
# and pass for a tick.

on:
  schedule:
    # Every hour at :17. The minute is not expected to matter (spec §2.2); it
    # only keeps off the top of the hour.
    - cron: '17 * * * *'

permissions: {}

# Like production-checks.yml, so a burst of late ticks also shows what GitHub
# does with a pending run in the group (B19.2's gate has to handle it).
concurrency:
  group: schedule-probe
  cancel-in-progress: false

jobs:
  tick:
    name: Tick
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Nothing to do — the run's creation time is the measurement
        run: 'true'
