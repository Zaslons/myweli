name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every job runs on UTC clocks — the salon timezone is UTC+0 and date-boundary
# seeds must be deterministic (docs/design/timezone-salon-time.md §4).
env:
  TZ: UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Zero-issue gate: infos and warnings are fatal, matching the
      # "analyze = 0" rule in the dev guardrails.
      - name: Analyze (zero issues required)
        run: flutter analyze --fatal-infos --fatal-warnings

      # This also runs the GOLDEN tests. They only execute on Linux (see
      # test/support/golden.dart) — which is this runner, and which is why the
      # committed PNGs are authored here too, via tool/update_goldens.sh.
      # Elsewhere they skip with a reason instead of failing on font
      # rasterization differences.
      - name: Run tests (with coverage)
        run: flutter test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: mobile/coverage/lcov.info
          if-no-files-found: warn

      # A golden failure is a PICTURE. Without these, all you get in the log is
      # "pixels differ" and no way to see what moved.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: mobile/test/golden/failures/
          if-no-files-found: ignore

  backend:
    name: Backend — Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres service so the DB-backed repository tests (B3c) run against a real
    # database; without DATABASE_URL those tests skip (e.g. local dev).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myweli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.10.7

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Zero-issue gate, matching the mobile job and the dev guardrails.
      - name: Analyze (zero issues required)
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: dart test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/myweli_test

  backend-boot-smoke:
    name: Backend — boot smoke + funnel e2e
    runs-on: ubuntu-latest
    # The first job in this file to carry one, and it earns it: this job now
    # BOOTS a server, so a hang would burn the full runner limit instead of
    # failing. 12 min is ~3× the measured p95 budget (Q1 spec §7.1).
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    # Validates the *production build path* the unit tests never exercise: the
    # custom entrypoint (main.dart) runs `initializeDatabase()` → real
    # migrations + provider seed against Postgres, then the server actually
    # serves. Catches route-tree code-gen breaks and startup/migration faults
    # before they reach a deploy.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myweli_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/myweli_smoke
      JWT_SECRET: ci-boot-smoke-secret
      ENV: dev
      PORT: "8080"
      # **Mirror production's auth config, or CI is green about a door nobody
      # opens.** `auth_methods.dart:21` makes `phone` a DEFAULT and this job
      # used to set nothing, so its only auth assertion drove
      # `/auth/otp/request` — which `render.yaml:58` documents as dormant
      # ("phone-OTP dormant — SMS too costly") — and never touched the e-mail
      # door production actually serves. Assertion A4 now pins the SMS door
      # shut; the funnel signs in by e-mail, like production.
      AUTH_METHODS: google,apple,email
      # Fake and non-secret by construction. `dependencies.dart:750-752` seeds a
      # staff account when these are set and is a no-op when they are not; the
      # funnel's Phase 7 needs one to suspend a salon and assert row 82's fourth
      # vocabulary. Never a real credential — gitleaks would fail the run.
      ADMIN_EMAIL: smoke-admin@myweli.test
      ADMIN_PASSWORD: smoke-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.10.7

      - name: Install dependencies
        run: dart pub get

      - name: Activate dart_frog CLI
        run: dart pub global activate dart_frog_cli 1.2.14

      # Code-gens build/bin/server.dart from the whole route tree — fails the
      # job if any route file is misplaced or won't compile.
      - name: Build production server
        run: dart pub global run dart_frog_cli:dart_frog build

      # AOT, exactly as `backend/Dockerfile:25-27` does it — so the artifact
      # under test is the artifact that deploys, not a JIT approximation of it.
      # What this still does NOT cover is the `scratch` IMAGE (Dockerfile:29-32):
      # a shared object missing there would reach production regardless.
      - name: Compile the deploy artifact (AOT, as the Dockerfile does)
        run: cd build && dart pub get && dart compile exe bin/server.dart -o bin/server

      - name: Boot server + smoke endpoints (real Postgres migrations)
        run: |
          set -euo pipefail
          ./build/bin/server >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            echo '--- server log ---'; cat /tmp/server.log || true
          }
          trap cleanup EXIT
          # Wait for the server to answer /health (fail fast if it dies).
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:${PORT}/health" >/dev/null 2>&1 \
              && { echo "server up after ${i}s"; break; }
            kill -0 "$SERVER_PID" 2>/dev/null || { echo 'server died during boot'; exit 1; }
            sleep 1
          done
          # /health → ok
          curl -fsS "http://localhost:${PORT}/health" | tee /tmp/health.json; echo
          grep -q '"status":"ok"' /tmp/health.json
          # /providers → seeded data (proves migrations + seed ran on Postgres)
          curl -fsS "http://localhost:${PORT}/providers" | tee /tmp/providers.json; echo
          grep -q '"id":"provider1"' /tmp/providers.json
          # /localities → the seeded reference tree (multi-pays MP1)
          curl -fsS "http://localhost:${PORT}/localities" | tee /tmp/localities.json; echo
          grep -q '"code":"CI"' /tmp/localities.json
          grep -q '"id":"cocody"' /tmp/localities.json
          # **The phone-OTP round-trip that used to live here is GONE, and its
          # removal is the point.** It posted to `/auth/otp/request`, which
          # `AUTH_METHODS=google,apple,email` now answers 404
          # `auth_method_disabled` — and `curl -fsS` exits 22 on a 404, so the
          # job died here before the funnel ever ran. That is exactly the
          # divergence this slice exists to close: the assertion was green only
          # because CI ran a configuration production does not.
          #
          # Auth is now covered properly one step down: A4 pins the SMS door
          # SHUT, and the funnel signs both a pro and two consumers in over the
          # e-mail door production actually serves.
          echo 'boot smoke passed ✅'

          # --- The funnel, against the SAME running server ------------------
          #
          # In this step, not its own: each `run:` is a separate shell, and the
          # trap above kills the server when this one ends — a second step would
          # have to boot and wait for a second server for no signal.
          #
          # The curl checks above stay. They are the BOOT proof and they fail
          # faster and far more legibly than a Dart VM start when the server
          # never came up at all.
          #
          # Fail-closed: the harness throws on an unset SMOKE_BASE_URL rather
          # than skipping, so this can never pass vacuously. It lives in `tool/`,
          # not `test/`, so the backend job's bare `dart test` does not collect
          # it — measured (0 hits for a marker over the full 622-test run), not
          # assumed.
          SMOKE_BASE_URL="http://localhost:${PORT}" dart test tool/smoke/funnel_smoke_test.dart

      - name: Q1b — the smoke seam, against a real ENV=prod server
        working-directory: backend/build
        env:
          # The whole point: ENV=prod is the configuration in which devCode is
          # suppressed, and it is the one configuration the funnel gate could
          # never run in. Everything above runs ENV=dev, so this behaviour has
          # no coverage anywhere else.
          ENV: prod
          # DATABASE_URL is inherited from the job (myweli_smoke). Restating it
          # here is what failed the first run — it named myweli_test, which the
          # Postgres service container never creates, so the server died at boot
          # with 3D000 and every curl hit a closed port.
          JWT_SECRET: ci-prod-mode-secret
          AUTH_METHODS: google,apple,email
          # The OTP route reads EmailProvider, which fail-fasts in prod. A dummy
          # satisfies the guard; the send then fails and is ignored (delivery is
          # best-effort and the route never inspects the result).
          RESEND_API_KEY: not-a-resend-key-delivery-is-ignored-here
          # ---------------------------------------------------------------
          # Everything below became REQUIRED when the `guardsOn` fail-fasts
          # started firing at boot rather than on first use (BACKEND.md §3.2.2).
          #
          # That this step ever booted was the bug, not the fix: it claimed to
          # rehearse `ENV=prod` while missing eight variables production cannot
          # run without, because each guard was a lazy `final` that no request in
          # this step happened to touch. It was rehearsing a configuration
          # production could never have had.
          #
          # Real values where the guard is about *identity* (origins, client-id
          # allowlists), and the explicit `disabled` opt-out where the guard is
          # about a *channel* CI has no business reaching. Never blank: an unset
          # value is what the guards exist to catch.
          WEB_ORIGINS: http://localhost:8788
          GOOGLE_CLIENT_IDS: ci-not-a-real-client-id.apps.googleusercontent.com
          APPLE_CLIENT_IDS: com.myweli.app.ci
          MESSAGING_PROVIDER: disabled
          PUSH_PROVIDER: disabled
          STORAGE_PROVIDER: disabled
        run: |
          set -euo pipefail
          PORT=8788
          # Composed here rather than written as a literal in `env:`. A 32+ char
          # value assigned to a `*_SECRET` key is precisely the shape gitleaks'
          # generic-api-key rule matches, and a placeholder that trips the
          # credential scanner would train us to wave the scanner through.
          export SMOKE_OTP_SECRET="ci-placeholder-$(printf 'x%.0s' $(seq 1 24))"
          PORT=$PORT ./bin/server & SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS "http://localhost:${PORT}/health" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://localhost:${PORT}/health" >/dev/null

          req() {
            curl -sS -X POST "http://localhost:${PORT}/auth/email/otp/request" \
              -H 'content-type: application/json' \
              ${2:+-H "X-Smoke-Secret: $2"} \
              -d "{\"email\":\"$1\"}"
          }
          has_code() { echo "$1" | grep -q '"devCode"'; }

          # 1. The account-takeover case. A correct secret must NOT disclose for
          #    a real address — this is the assertion the whole design exists to
          #    make true, so it runs first.
          R=$(req 'owner@gmail.com' "$SMOKE_OTP_SECRET")
          if has_code "$R"; then echo "::error::PROD DISCLOSED AN OTP FOR A REAL ADDRESS"; exit 1; fi
          echo "  ok  real address + correct secret → no devCode"

          # 2. A valid identity with no header must stay suppressed.
          R=$(req 'x@smoke.test')
          if has_code "$R"; then echo "::error::prod disclosed without the header"; exit 1; fi
          echo "  ok  .test identity, no header → no devCode"

          # 3. A wrong secret must not unlock it.
          # SAME LENGTH, last byte differs: a longer/shorter value would be
          # rejected by the length check without ever reaching the byte compare,
          # which is the part actually worth testing.
          R=$(req 'x@smoke.test' "${SMOKE_OTP_SECRET%?}y")
          if has_code "$R"; then echo "::error::prod disclosed on a wrong secret"; exit 1; fi
          echo "  ok  .test identity, wrong secret → no devCode"

          # 4. Both conditions → the code comes back. Without this the cutover
          #    gate cannot authenticate at all, so a seam that only ever refuses
          #    would be just as broken as one that always discloses.
          R=$(req 'client@smoke.test' "$SMOKE_OTP_SECRET")
          if ! has_code "$R"; then echo "::error::the seam did not disclose for a valid smoke identity: $R"; exit 1; fi
          echo "  ok  .test identity + correct secret → devCode present"

  web:
    name: Web — Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fail if the committed API types drift from the OpenAPI contract.
      - name: API types match the contract
        run: |
          npm run gen:api
          git diff --exit-code lib/api/schema.ts

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        # Explicit, not inherited from a default. `lib/api-base.ts` refuses to
        # resolve a production build without this, because the build-time
        # fetches degrade to EMPTY results rather than failing — so a missing
        # value publishes a site with no salons and no error anywhere. CI has no
        # backend, so it states localhost deliberately; the guard is about the
        # value being chosen, not about which value it is.
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

  web-e2e:
    name: Web — e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds + serves the app against a stub API (hermetic) and runs the e2e.
      - name: Run e2e
        run: npm run e2e

      # B12 turned on `trace: 'retain-on-failure'` so a red run could be
      # explained — but the trace was written into the runner's test-results/
      # and died with the runner, so it never actually could be. The first red
      # run after that (30596760578) had to be diagnosed from source instead.
      # Collect it: the zip is the difference between reading a failure and
      # guessing at one.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  web-lighthouse:
    name: Web — Lighthouse
    runs-on: ubuntu-latest
    # BLOCKING since B5 (§14): a11y ≥ 0.95 and SEO ≥ 0.9 are errors;
    # performance/best-practices stay warn (the flake-prone pair).
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Explicit, not inherited from a default. `lib/api-base.ts` refuses to
        # resolve a production build without this, because the build-time
        # fetches degrade to EMPTY results rather than failing — so a missing
        # value publishes a site with no salons and no error anywhere. CI has no
        # backend, so it states localhost deliberately; the guard is about the
        # value being chosen, not about which value it is.
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

      - name: Lighthouse budgets (home + connexion)
        run: npm run lhci

  # A9-fix: NFR-PERF-002 sets <30 MB and PR-0 shipped it with no measured
  # number anywhere and no job checking it — unfalsifiable for the whole life
  # of the budget. First measurement: **22.68 MB** (arm64, consumer, release),
  # so the threshold below lands with 7.3 MB of headroom rather than being
  # guessed.
  #
  # **`--flavor consumer` is load-bearing.** This project has product flavors
  # (android/app/build.gradle.kts:49-61), so Gradle emits
  # `app-consumer-release.apk`; a flavourless `flutter build apk` looks for
  # `app-release.apk` and fails with "Gradle build failed to produce an .apk
  # file" AFTER a successful ~500s build. A9's first attempt read that as a
  # broken release build and recorded it in the register as one. It was a wrong
  # command, not a broken build.
  #
  # Separate job so it never slows the analyze/test feedback loop.
  admin-console-build:
    name: Mobile — admin console builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    # Does-it-compile only. Shipping the console is deploy-admin.yml, which is
    # manual and confirm-gated.
    #
    # This job exists because removing that workflow's push trigger removed the
    # ONLY thing that ever compiled `lib/main_admin.dart` — it is a Flutter Web
    # target that no other job touches, so a mobile refactor could have broken
    # it and nothing would have said so until someone deployed.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The same defines deploy-admin.yml uses, so this compiles the artifact
      # that would actually ship. They are also REQUIRED now: a release build
      # without them refuses to start (build_config_guard.dart).
      - name: Build the admin web bundle
        run: |
          flutter build web --release \
            --target lib/main_admin.dart \
            --dart-define=USE_API_BACKEND=true \
            --dart-define=API_BASE_URL=https://api.myweli.com

  apk-size:
    name: Mobile — APK size
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned rather than inherited: AGP 8.11.1 (settings.gradle.kts:22)
      # requires JDK 17+, and a job whose product is a comparable NUMBER must
      # not take its toolchain from whatever the image ships this month.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # arm64 only: it is what the reference low-end Android actually runs, and
      # a universal APK's number is not the one a user downloads.
      - name: Build release APK (consumer, arm64)
        run: flutter build apk --release --flavor consumer --target-platform android-arm64

      - name: Enforce the <30 MB budget (NFR-PERF-002)
        run: |
          APK=build/app/outputs/flutter-apk/app-consumer-release.apk
          BYTES=$(stat -c%s "$APK")
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES/1048576}")
          echo "### APK: ${MB} MB / 30 MB budget" >> "$GITHUB_STEP_SUMMARY"
          echo "arm64 · consumer · release — ROADMAP Part 6, NFR-PERF-002" >> "$GITHUB_STEP_SUMMARY"
          echo "APK size: ${MB} MB (budget 30 MB)"
          # Blocking, because the number is now known and under budget. A
          # threshold guessed BEFORE the first measurement would have failed
          # PRs on a pre-existing condition; one set after it is a real gate.
          awk "BEGIN {exit !($BYTES > 30*1048576)}" && {
            echo "::error::APK is ${MB} MB, over the 30 MB budget (NFR-PERF-002)"
            exit 1
          }
          echo "Within budget."

  security:
    name: Security — secrets & dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fail the build if any credential is committed anywhere in the repo.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --no-git --redact --verbose

      # Known-vulnerability scan of the backend deps (blocking).
      - name: Dependency vulnerabilities — backend
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            ghcr.io/google/osv-scanner:v1.8.5 \
            --lockfile=/src/backend/pubspec.lock

      # The large Flutter dep tree is surfaced but not yet blocking, pending a
      # first triage; promote to blocking once clean (docs/BACKEND.md §6).
      - name: Dependency vulnerabilities — mobile (report-only)
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            ghcr.io/google/osv-scanner:v1.8.5 \
            --lockfile=/src/mobile/pubspec.lock

      # The npm tree is surfaced but not yet blocking, like mobile.
      - name: Dependency vulnerabilities — web (report-only)
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            ghcr.io/google/osv-scanner:v1.8.5 \
            --lockfile=/src/web/package-lock.json
