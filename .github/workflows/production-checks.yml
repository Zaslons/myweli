name: Production checks

# **The measurements that were only ever taken by hand.**
#
# `check:cwv` and `check:privacy` run against the REAL domain, and both existed
# only as npm scripts someone had to remember. `grep "schedule:|cron:"` over
# this directory returned nothing at all, so the repo's entire safety net was
# push-triggered — and CI's own Lighthouse job measures **localhost against a
# stub**, where neither of the two real findings could ever have appeared:
#
#   /connexion CLS 0.131   — only reproducible on the deployed page
#   g_state before consent — only visible in the deployed bundle
#
# A one-shot measurement written into LAUNCH.md is true for a day. A Vercel
# deploy tomorrow can regress either of these and nothing would fire. This is
# the mechanism that replaces remembering.
#
# It is a MONITOR, not a gate: it cannot block a merge, so a failure here means
# production is already wrong and needs looking at.

on:
  schedule:
    # 06:00 UTC daily — before the Abidjan working day (UTC+0, so local too).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Base URL to measure (defaults to production)'
        required: false
        default: 'https://myweli.com'

permissions:
  contents: read
  issues: write
  # Workload Identity Federation for the retention check below. No key material
  # anywhere — the token is minted per run and expires with it.
  id-token: write

concurrency:
  group: production-checks
  cancel-in-progress: false

jobs:
  cwv:
    name: Real domain — Core Web Vitals (mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # No build and no server: `tool/lighthouse-production.json` has no
      # `startServerCommand`, deliberately — sharing the localhost config would
      # quietly measure a local build instead of the thing being asserted.
      - name: Lighthouse against myweli.com
        run: npm run check:cwv

  privacy:
    name: Real domain — the privacy promises
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Asserts against the DEPLOYED bundle, where Sentry is actually
      # initialised — the reason three earlier in-repo attempts at this check
      # passed for the wrong reason (`tool/check-privacy-promise.spec.ts`
      # records all three).
      - name: Privacy promises against myweli.com
        run: npm run check:privacy
        env:
          PRIVACY_URL: ${{ github.event.inputs.target || 'https://myweli.com' }}

  retention:
    name: Real domain — the 30-day log retention we promise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # **A separate identity holding one custom role with two permissions.**
      # Not the deployer (it holds run.admin project-wide), and not
      # roles/logging.viewer — that one grants logging.logEntries.list, so it
      # can read log ENTRIES, which on this service contain user IP addresses
      # and user agents. Reading production logs containing PII in order to
      # check a PRIVACY setting would be a net loss.
      # Provisioned by infra/gcp/41-iam-checks-sa.sh.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/731308991240/locations/global/workloadIdentityPools/github/providers/myweli-repo
          service_account: myweli-checks@myweli.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      # The privacy policy tells users « Ces journaux … sont supprimés
      # automatiquement au bout de 30 jours ». backend/test/infra/
      # log_retention_test.dart holds the manifest to the published page on
      # every push; this holds the LIVE bucket to the manifest. Neither alone is
      # enough — the test cannot see GCP, and this cannot see the sentence.
      # **The negative control, and it is the point of the custom role.**
      #
      # That this identity CAN read the bucket is proved by the step below. That
      # it CANNOT read log entries was, until this step existed, an INFERENCE
      # from the role definition — nobody had watched it be refused. The whole
      # argument for a two-permission custom role over roles/logging.viewer is
      # that log entries on this service carry user IP addresses and user
      # agents; an argument nobody has tested is a claim, not a control.
      #
      # Runs daily, so a future `add-iam-policy-binding` that quietly widens
      # this identity fails here instead of going unnoticed.
      - name: It CANNOT read a log entry — refusal is the assertion
        run: |
          set -uo pipefail
          if out=$(gcloud logging read 'severity>=DEFAULT' --project=myweli \
                     --limit=1 --format='value(timestamp)' 2>&1); then
            echo "::error::this identity READ A LOG ENTRY. The custom role has been"
            echo "::error::widened, and CI can now see user IP addresses."
            exit 1
          fi
          case "$out" in
            *PERMISSION_DENIED*|*does\ not\ have*|*Forbidden*|*403*)
              echo "refused, as designed: ${out%%$'\n'*}" ;;
            *)
              # A network blip or a changed error shape must not be read as a
              # security property. Fail rather than assume the refusal was real.
              echo "::error::the read failed, but not with a permission error —"
              echo "::error::cannot conclude the identity is bounded: ${out}"
              exit 1 ;;
          esac

      - name: Live bucket matches infra/gcp/logging-manifest.json
        run: bash infra/gcp/97-verify-log-retention.sh

  attestation:
    name: The registration claim — has anyone confirmed it lately?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # **The one check here that cannot verify its subject.** The mentions
      # légales tell the public MyWeli is « société en cours d'immatriculation ».
      # No API answers whether that is still true — the only person who knows is
      # the owner. So this asserts that someone LOOKED, and fails when nobody
      # has in 90 days.
      #
      # Until now the guard on that claim was pointed backwards: a unit test
      # asserted the claim was still PENDING, so it went red the day the claim
      # was CORRECTED and stayed green while it went stale.
      #
      # The consistency half — all seven surfaces of the claim agreeing with
      # each other — is clock-free and lives in the merge gate
      # (web/tests/registration-claim.test.ts). Only the « is it still true? »
      # half is here, because a suite that turns red on a date fails a future PR
      # at random and looks like that PR's fault.
      - name: Is the registration claim still attested?
        run: node infra/legal/98-verify-registration-attestation.mjs

  # **A monitor whose only signal is a red row in the Actions tab is a monitor
  # nobody reads.** Every other alert in this system reaches a person — the
  # Cloud Monitoring policies all carry the 'Owner email' channel — and this one
  # did not, which made it the weakest link in exactly the layer that exists to
  # catch what CI cannot see.
  #
  # One issue, reopened and commented rather than duplicated, so a week of
  # failures is one thread and not seven.
  report:
    name: Say so, if any check failed
    needs: [cwv, privacy, retention, attestation]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # **Without this `gh` cannot resolve the repository at all.** This job
          # does not check out — it has nothing to build — and `gh` falls back to
          # the git remote, so every command died with "not a git repository".
          # Verified by running the same command outside a checkout.
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CWV: ${{ needs.cwv.result }}
          PRIVACY: ${{ needs.privacy.result }}
          RETENTION: ${{ needs.retention.result }}
          ATTESTATION: ${{ needs.attestation.result }}
        run: |
          set -euo pipefail
          TITLE='Production checks are failing'

          # **`.[0] | "\(.number)"` on an empty list yields the STRING "null
          # null", which is not empty** — so the old script took the update path
          # and ran `gh issue reopen null`. The repo has zero issues, so the
          # FIRST failure, the only one that matters, took the broken path.
          # `// empty` emits nothing instead. Verified against the real repo.
          NUM=$(gh issue list --state all --search "$TITLE in:title" \
                  --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          BODY=$(printf '%s\n' \
            'The scheduled real-domain checks failed.' \
            '' \
            "CWV: ${CWV} · privacy: ${PRIVACY} · retention: ${RETENTION} · attestation: ${ATTESTATION}" \
            '' \
            "${RUN}" \
            '' \
            'Three of these run against myweli.com — not a preview, not a' \
            'stub — so if CWV, privacy or retention failed, production is' \
            '**already** wrong. There is no merge to block, which is why this' \
            'is a monitor and not a gate.' \
            '' \
            'The CWV job asserts the docs/WEB.md §7 budgets. The privacy job' \
            'asserts that no page reaches an undisclosed third party before the' \
            'visitor chooses one. The retention job asserts the live log bucket' \
            'still matches the 30 days the privacy policy promises users.' \
            '' \
            '**The attestation job is different, and a failure there does NOT' \
            'mean production is wrong.** It asserts that somebody has confirmed' \
            'in the last 90 days that « société en cours d immatriculation » is' \
            'still true — a fact no API can answer. If it is the only one red,' \
            'the fix is a one-line edit to' \
            'infra/legal/registration-manifest.json: either flip `registered`' \
            'and let web/tests/registration-claim.test.ts list every surface to' \
            'rewrite, or move `attestedOn` to today.')

          if [ -n "$NUM" ]; then
            STATE=$(gh issue view "$NUM" --json state --jq .state)
            [ "$STATE" = 'CLOSED' ] && gh issue reopen "$NUM"
            gh issue comment "$NUM" --body "$BODY"
            echo "commented on #$NUM"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
