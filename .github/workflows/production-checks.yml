name: Production checks

# **The measurements that were only ever taken by hand.**
#
# `check:cwv` and `check:privacy` run against the REAL domain, and both existed
# only as npm scripts someone had to remember. `grep "schedule:|cron:"` over
# this directory returned nothing at all, so the repo's entire safety net was
# push-triggered — and CI's own Lighthouse job measures **localhost against a
# stub**, where neither of the two real findings could ever have appeared:
#
#   /connexion CLS 0.131   — only reproducible on the deployed page
#   g_state before consent — only visible in the deployed bundle
#
# A one-shot measurement written into LAUNCH.md is true for a day. A Vercel
# deploy tomorrow can regress either of these and nothing would fire. This is
# the mechanism that replaces remembering.
#
# It is a MONITOR, not a gate: it cannot block a merge, so a failure here means
# production is already wrong and needs looking at.

on:
  schedule:
    # 06:00 UTC daily — before the Abidjan working day (UTC+0, so local too).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Base URL to measure (defaults to production)'
        required: false
        default: 'https://myweli.com'

permissions:
  contents: read
  issues: write
  # Workload Identity Federation for the retention check below. No key material
  # anywhere — the token is minted per run and expires with it.
  id-token: write

concurrency:
  group: production-checks
  cancel-in-progress: false

jobs:
  cwv:
    name: Real domain — Core Web Vitals (mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # No build and no server: `tool/lighthouse-production.json` has no
      # `startServerCommand`, deliberately — sharing the localhost config would
      # quietly measure a local build instead of the thing being asserted.
      - name: Lighthouse against myweli.com
        run: npm run check:cwv

  privacy:
    name: Real domain — the privacy promises
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Asserts against the DEPLOYED bundle, where Sentry is actually
      # initialised — the reason three earlier in-repo attempts at this check
      # passed for the wrong reason (`tool/check-privacy-promise.spec.ts`
      # records all three).
      - name: Privacy promises against myweli.com
        run: npm run check:privacy
        env:
          PRIVACY_URL: ${{ github.event.inputs.target || 'https://myweli.com' }}

  legal:
    name: Real domain — the registration claim the site publishes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # **The only check in this repo that looks at the live legal pages.**
      # Everything else reads the repository: the merge gate holds the manifest
      # to the source, the attestation job asks whether anyone re-confirmed the
      # fact. None of them can see myweli.com — and `web/` has no deploy
      # workflow, so production is whatever Vercel last promoted. A rollback to
      # a pre-registration deployment would restore the old wording to the live
      # mentions légales with the entire suite green.
      - name: The published claim matches the manifest
        run: npm run check:legal
        env:
          PRIVACY_URL: ${{ github.event.inputs.target || 'https://myweli.com' }}

  retention:
    name: Real domain — the 30-day log retention we promise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # **A separate identity holding one custom role with two permissions.**
      # Not the deployer (it holds run.admin project-wide), and not
      # roles/logging.viewer — that one grants logging.logEntries.list, so it
      # can read log ENTRIES, which on this service contain user IP addresses
      # and user agents. Reading production logs containing PII in order to
      # check a PRIVACY setting would be a net loss.
      # Provisioned by infra/gcp/41-iam-checks-sa.sh.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/731308991240/locations/global/workloadIdentityPools/github/providers/myweli-repo
          service_account: myweli-checks@myweli.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      # The privacy policy tells users « Ces journaux … sont supprimés
      # automatiquement au bout de 30 jours ». backend/test/infra/
      # log_retention_test.dart holds the manifest to the published page on
      # every push; this holds the LIVE bucket to the manifest. Neither alone is
      # enough — the test cannot see GCP, and this cannot see the sentence.
      # **The negative control, and it is the point of the custom role.**
      #
      # That this identity CAN read the bucket is proved by the step below. That
      # it CANNOT read log entries was, until this step existed, an INFERENCE
      # from the role definition — nobody had watched it be refused. The whole
      # argument for a two-permission custom role over roles/logging.viewer is
      # that log entries on this service carry user IP addresses and user
      # agents; an argument nobody has tested is a claim, not a control.
      #
      # Runs daily, so a future `add-iam-policy-binding` that quietly widens
      # this identity fails here instead of going unnoticed.
      - name: It CANNOT read a log entry — refusal is the assertion
        run: |
          set -uo pipefail
          if out=$(gcloud logging read 'severity>=DEFAULT' --project=myweli \
                     --limit=1 --format='value(timestamp)' 2>&1); then
            echo "::error::this identity READ A LOG ENTRY. The custom role has been"
            echo "::error::widened, and CI can now see user IP addresses."
            exit 1
          fi
          case "$out" in
            *PERMISSION_DENIED*|*does\ not\ have*|*Forbidden*|*403*)
              echo "refused, as designed: ${out%%$'\n'*}" ;;
            *)
              # A network blip or a changed error shape must not be read as a
              # security property. Fail rather than assume the refusal was real.
              echo "::error::the read failed, but not with a permission error —"
              echo "::error::cannot conclude the identity is bounded: ${out}"
              exit 1 ;;
          esac

      - name: Live bucket matches infra/gcp/logging-manifest.json
        run: bash infra/gcp/97-verify-log-retention.sh

  secretpins:
    name: Real project — the secret versions the manifests pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A SECOND custom role on the same identity, not a widening of the first.
      # The log-entry control below is about `logBucketConfigReader`; this job's
      # control is about `secretVersionLister`. Blurring them into one role would
      # make one control's message false. Provisioned by
      # infra/gcp/42-iam-secret-pins-sa.sh.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/731308991240/locations/global/workloadIdentityPools/github/providers/myweli-repo
          service_account: myweli-checks@myweli.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      # **The negative control, and the reason the role is custom.**
      #
      # That this identity can read version METADATA is proved by the step
      # below. That it CANNOT read a version's VALUE would otherwise be an
      # inference from the role definition — and the whole argument for a
      # four-permission custom role over roles/secretmanager.viewer is that the
      # values include JWT_SECRET and DATABASE_URL. An argument nobody has
      # tested is a claim, not a control.
      #
      # The target is R2_ACCOUNT_ID deliberately. The binding is project-level,
      # so a refusal on any one secret proves the role lacks versions.access on
      # all of them — which makes the right target the one whose disclosure
      # would cost least if this control ever came back green.
      # service_files_test.dart already describes it as a non-credential.
      # (Residual, stated rather than left silent: a per-secret DENY policy
      # could produce a refusal here while access is granted elsewhere. No deny
      # policies exist in this project.)
      - name: It CANNOT read a secret value — refusal is the assertion
        run: |
          set -uo pipefail
          if out=$(gcloud secrets versions access latest --secret=R2_ACCOUNT_ID \
                     --project=myweli 2>&1); then
            echo "::error::this identity READ A SECRET VALUE. secretVersionLister"
            echo "::error::has been widened, and CI can now read JWT_SECRET."
            exit 1
          fi
          case "$out" in
            *PERMISSION_DENIED*|*does\ not\ have*|*Forbidden*|*403*)
              echo "refused, as designed" ;;
            *)
              # A network blip must not be read as a security property.
              echo "::error::the read failed, but not with a permission error —"
              echo "::error::cannot conclude the identity is bounded: ${out}"
              exit 1 ;;
          esac

      # SECRET_PINS_FIXTURE_JSON is deliberately NOT set here; secret_pins_test
      # fails if it ever appears in a workflow. A rehearsal that runs on the
      # schedule is a monitor that measures nothing.
      - name: Every pinned version is enabled and current
        run: bash infra/gcp/98-verify-secret-pins.sh

  basemap:
    name: CARTO — do the web maps still load without a key?
    runs-on: ubuntu-latest
    steps:
      # **A decision with an expiry date nobody can see from the repository.**
      #
      # Since 2026-09-25 CARTO refuses keyless RASTER tiles, so the apps carry
      # a key. The web draws VECTOR tiles, which CARTO still serves keyless —
      # and the web runs keyless ON PURPOSE: the free tier (1 M requests a
      # month) is shared by every key, every salon page renders a map, and a
      # keyed web would spend that quota on tiles that cost nothing today
      # (docs/design/map-basemap-key.md §7). The code is ready: the day
      # NEXT_PUBLIC_CARTO_BASEMAPS_KEY is set in Vercel, every CARTO request
      # the web makes carries it.
      #
      # The day CARTO extends its requirement to vector, every web map goes
      # blank or watermarked with the whole suite green — nothing in this repo
      # can see CARTO change its mind. So this asks, daily, exactly what a
      # myweli.com visitor's browser asks: one vector tile, no key.
      #
      # Red means set the variable (§9 step 3). Not a gate: CARTO changes on
      # its own schedule, not on a merge. web/tests/basemap.test.ts runs this
      # very script against a local server, both ways, and holds it here.
      - name: A keyless CARTO vector tile is still a 200 protobuf
        env:
          # Abidjan at z12 — a tile with data in it, where our maps open.
          TILE: https://tiles-a.basemaps.cartocdn.com/vectortiles/carto.streets/v1/12/2002/1987.mvt
        run: |
          set -uo pipefail
          meta=$(curl -sS -o tile.mvt -D headers.txt --max-time 30 \
                   --retry 3 --retry-delay 5 \
                   -w '%{http_code} %{size_download} %{content_type}' "$TILE") \
            || meta="000 0 unreachable"
          read -r code size type <<<"$meta"
          etag=$(tr -d '\r' 2>/dev/null < headers.txt | grep -i '^etag:' | tail -n 1)
          if [ "$code" = 000 ]; then
            # The network, not CARTO: this says nothing about keys. Fail
            # rather than assume — a check that measured nothing is not green.
            echo "::error::could not reach CARTO at all — nothing measured; re-run the job."
            exit 1
          fi
          # A 200 alone proves nothing: CARTO's raster refusal IS a 200, a
          # watermark tile with a `wm-` etag (spec §3.1).
          if [ "$code" = 200 ] && [[ "${type:-}" == application/x-protobuf* ]] \
             && [ "$size" -gt 0 ] && [[ "${etag:-}" != *wm-* ]]; then
            echo "still free: 200 ${type}, ${size} bytes, ${etag:-no etag}"
            exit 0
          fi
          echo "::error::a KEYLESS CARTO vector tile answered ${code} ${type:-no type} (${size} bytes; ${etag:-no etag}) — CARTO now wants a key on vector, and the web maps run keyless."
          echo "::error::Set NEXT_PUBLIC_CARTO_BASEMAPS_KEY in Vercel, Production only, to Secret Manager CARTO_BASEMAPS_WEB_KEY, then redeploy — docs/design/map-basemap-key.md §9 step 3."
          exit 1

  attestation:
    name: The registration claim — has anyone confirmed it lately?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # **The one check here that cannot verify its subject.** The mentions
      # légales tell the public MyWeli is « société en cours d'immatriculation ».
      # No API answers whether that is still true — the only person who knows is
      # the owner. So this asserts that someone LOOKED, and fails when nobody
      # has in 90 days.
      #
      # Until now the guard on that claim was pointed backwards: a unit test
      # asserted the claim was still PENDING, so it went red the day the claim
      # was CORRECTED and stayed green while it went stale.
      #
      # The consistency half — every recorded surface of the claim agreeing with
      # each other — is clock-free and lives in the merge gate
      # (web/tests/registration-claim.test.ts). Only the « is it still true? »
      # half is here, because a suite that turns red on a date fails a future PR
      # at random and looks like that PR's fault.
      - name: Is the registration claim still attested?
        run: node infra/legal/98-verify-registration-attestation.mjs

  # **A monitor whose only signal is a red row in the Actions tab is a monitor
  # nobody reads.** Every other alert in this system reaches a person — the
  # Cloud Monitoring policies all carry the 'Owner email' channel — and this one
  # did not, which made it the weakest link in exactly the layer that exists to
  # catch what CI cannot see.
  #
  # One issue, reopened and commented rather than duplicated, so a week of
  # failures is one thread and not seven.
  report:
    name: Say so, if any check failed
    needs: [cwv, privacy, legal, retention, attestation, secretpins, basemap]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # **Without this `gh` cannot resolve the repository at all.** This job
          # does not check out — it has nothing to build — and `gh` falls back to
          # the git remote, so every command died with "not a git repository".
          # Verified by running the same command outside a checkout.
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CWV: ${{ needs.cwv.result }}
          PRIVACY: ${{ needs.privacy.result }}
          LEGAL: ${{ needs.legal.result }}
          RETENTION: ${{ needs.retention.result }}
          ATTESTATION: ${{ needs.attestation.result }}
          SECRETPINS: ${{ needs.secretpins.result }}
          BASEMAP: ${{ needs.basemap.result }}
        run: |
          set -euo pipefail
          TITLE='Production checks are failing'

          # **`.[0] | "\(.number)"` on an empty list yields the STRING "null
          # null", which is not empty** — so the old script took the update path
          # and ran `gh issue reopen null`. The repo has zero issues, so the
          # FIRST failure, the only one that matters, took the broken path.
          # `// empty` emits nothing instead. Verified against the real repo.
          NUM=$(gh issue list --state all --search "$TITLE in:title" \
                  --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          BODY=$(printf '%s\n' \
            'The scheduled real-domain checks failed.' \
            '' \
            "CWV: ${CWV} · privacy: ${PRIVACY} · legal: ${LEGAL} · retention: ${RETENTION} · attestation: ${ATTESTATION} · secret pins: ${SECRETPINS} · basemap: ${BASEMAP}" \
            '' \
            "${RUN}" \
            '' \
            'Four of these run against myweli.com — not a preview, not a' \
            'stub — so if CWV, privacy, legal or retention failed, production' \
            'is **already** wrong. There is no merge to block, which is why' \
            'this is a monitor and not a gate.' \
            '' \
            'The CWV job asserts the docs/WEB.md §7 budgets. The privacy job' \
            'asserts that no page reaches an undisclosed third party before the' \
            'visitor chooses one. The retention job asserts the live log bucket' \
            'still matches the 30 days the privacy policy promises users. The' \
            'legal job asserts the mentions légales and the privacy policy on' \
            'the live site still publish the registration status the manifest' \
            'records — a red row there usually means Vercel is serving an older' \
            'deployment, since web/ has no deploy workflow of its own.' \
            '' \
            '**The attestation job is different, and a failure there does NOT' \
            'mean production is wrong.** It asserts that somebody has confirmed' \
            'recently — the job log gives the exact age and limit — that the' \
            'registration status published in the mentions légales is still' \
            'true, a fact no API can answer. If it is the only one red,' \
            'there are exactly two fixes, and only one of them is one line.' \
            'If registration completed: in ONE PR flip `registered` in' \
            'infra/legal/registration-manifest.json AND rewrite every surface it' \
            'lists — the merge gate stays red until both are done, by design, so' \
            'flipping the flag alone turns every open PR red. If it has not' \
            'completed: move `attestedOn` to today, and that IS one line.' \
            '' \
            '**The basemap job asks CARTO, not myweli.com.** Red there means a' \
            'KEYLESS CARTO vector tile is no longer served, and the web maps run' \
            'keyless by decision (docs/design/map-basemap-key.md §7) — so they' \
            'are blank or watermarked right now. Set NEXT_PUBLIC_CARTO_BASEMAPS_KEY' \
            'in Vercel, Production only, to the value of Secret Manager' \
            'CARTO_BASEMAPS_WEB_KEY, then redeploy (§9 step 3).')

          if [ -n "$NUM" ]; then
            STATE=$(gh issue view "$NUM" --json state --jq .state)
            [ "$STATE" = 'CLOSED' ] && gh issue reopen "$NUM"
            gh issue comment "$NUM" --body "$BODY"
            echo "commented on #$NUM"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
