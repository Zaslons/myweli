# Deploy the backend to Cloud Run — staging or production (G1).
#
# Authentication is **Workload Identity Federation** — GitHub's OIDC token is
# exchanged for a short-lived GCP credential. There is no service-account JSON
# key in this repo or in GitHub secrets, so a leaked repo leaks no credential.
# The trust is pinned on the GCP side to `assertion.repository == Zaslons/myweli`;
# without that condition any repository on GitHub could mint a token for this
# pool.
#
# **The deployer's `roles/run.admin` is PROJECT-WIDE**, so a token minted for a
# staging deploy can replace the production service just as easily. Nothing in
# this file can change that — but two things here make it hard to do by accident:
# the `metadata.name` in each service file is a literal (never templated), and
# the deploy step refuses to run when that name disagrees with the environment
# being deployed.
#
# **The credential IS narrowed, as of 2026-08-16.** `infra/gcp/40-iam-wif.sh
# widen` then `narrow confirm` ran, and the deploy AFTER `narrow` succeeded —
# which is the only real evidence, because while both bindings existed IAM
# granted on their union and GCP never reports which principalSet satisfied a
# request. The deployer can now be impersonated only by
# `attribute.environment/backend-staging` or `.../backend-production`, so a job
# that does not declare an `environment:` cannot mint a token at all.
#
# The provider's `attributeCondition` is still `assertion.repository==
# 'Zaslons/myweli'` and that is correct: it is the outer gate deciding who may
# exchange a token, while the bindings above are the inner one deciding who may
# become the deployer.
#
# **Staging is push-to-deploy; production is not.** The `push:` block below runs
# on every merge to main that touches the server or its manifests. Production
# remains `workflow_dispatch` with a typed confirmation, and a push cannot reach
# it — see the note on the trigger.
name: Deploy — backend (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy'
        type: choice
        options: [staging, production]
        default: staging
        required: true
      confirm:
        description: 'PRODUCTION ONLY — type "deploy" to confirm'
        required: false
        default: ''
      image_tag:
        description: 'Optional: an existing image tag (short SHA) to deploy instead of building. This is how a production deploy ships the exact artifact staging rehearsed — the tag is resolved to a digest either way.'
        required: false
        default: ''
      unpin:
        description: 'Type "yes" only if a rollback traffic pin is in place and THIS deploy should release it — docs/design/infra-rollback.md §7.1'
        required: false
        default: ''
  # Enabled 2026-08-16, after `40-iam-wif.sh narrow` and the deploy that
  # validated it. Staging now redeploys on every merge to main that touches the
  # server or its manifests.
  #
  # A push event carries no `inputs`, so `inputs.environment` and
  # `inputs.confirm` are both empty — which is why every expression in this file
  # that reads them supplies an explicit default. Checked, one by one, before
  # uncommenting: the concurrency group (:74), the GitHub environment (:92), the
  # confirm guard (:103), the target resolver (:146), the build step (:232) and
  # the verifier (:319) all default to `staging`.
  #
  # **A push therefore cannot reach production.** The confirm guard reads
  # `(inputs.environment || 'staging') == 'production'`, which is false on a
  # push, so the guard is skipped — and it is skipped because the deploy is
  # staging, not because the confirmation was waived. Production stays
  # dispatch-only, with the typed word.
  #
  # `image_tag` is the one expression with NO default, and that is correct: empty
  # means "build from source" (:181-189), which is what a merge should do.
  # Promotion of an existing digest stays a deliberate, dispatch-only act.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/gcp/service.yaml'
      - 'infra/gcp/service-staging.yaml'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: myweli
  REGION: europe-west9
  REGISTRY: europe-west9-docker.pkg.dev

# Per environment, not one queue for both: a shared group would park a
# production hotfix behind an in-flight staging deploy, and once staging deploys
# are the frequent ones that is a wait measured in builds.
concurrency:
  group: deploy-backend-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # **Not `Production`/`Preview`** — those two already exist, created by the
    # Vercel integration, and reusing them would mix backend deploys into
    # Vercel's deployment activity log. These names are ours.
    #
    # An environment that does not exist yet is auto-created on first use with no
    # protection rules, so this cannot break a deploy; adding required reviewers
    # to `backend-production` is an owner action in repo settings, and it is what
    # turns "typed the word deploy" into a real approval. It also makes GitHub
    # put an `environment` claim in the OIDC token, which is what the WIF
    # condition will pin.
    environment: backend-${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write # required for the OIDC token — nothing else needs write

    steps:
      - name: Guard — a PRODUCTION dispatch must be confirmed
        # Scoped to production. The old form was `github.event_name ==
        # 'workflow_dispatch' && inputs.confirm != 'deploy'`, which would have
        # gone silently inert on the push trigger above — the one path that
        # deploys without a human in the loop.
        if: (github.event.inputs.environment || 'staging') == 'production' && github.event.inputs.confirm != 'deploy'
        run: |
          echo "::error::Type 'deploy' in the confirm input to deploy production."
          exit 1

      - uses: actions/checkout@v7
        with:
          # The emitter-lag check reads source at the commit each service is
          # RUNNING, which on a promotion is not GITHUB_SHA. A shallow clone
          # holds one commit, so `git grep <that-sha>` would fail — and the
          # check refuses to run shallow rather than passing blind.
          fetch-depth: 0

      - name: Resolve this environment's target
        run: |
          set -euo pipefail
          # Committed here rather than in GitHub Environment *variables* on
          # purpose. This repo's stance is that deploy configuration is
          # reviewable in a PR — the same reason `service.yaml` is declarative
          # and the reason the Render dashboard's invisible cron jobs were a
          # problem. A value only visible in a settings page is the shape of
          # config that drifts unnoticed.
          case "${ENVIRONMENT}" in
            staging)
              echo "SERVICE=myweli-api-staging" >> "$GITHUB_ENV"
              echo "SERVICE_YAML=infra/gcp/service-staging.yaml" >> "$GITHUB_ENV"
              # Staging has no load balancer, so its own *.run.app address is the
              # only door — and it is READ BACK from the service below, never
              # constructed, because Cloud Run publishes two run.app hostnames
              # for one service and only `status.url` is the right one.
              echo "URL_SOURCE=status-url" >> "$GITHUB_ENV"
              ;;
            production)
              echo "SERVICE=myweli-api" >> "$GITHUB_ENV"
              echo "SERVICE_YAML=infra/gcp/service.yaml" >> "$GITHUB_ENV"
              # The opposite: `ingress: internal-and-cloud-load-balancing` makes
              # production's run.app URL 404 BY DESIGN, so `status.url` is the
              # wrong answer here. The hostname belongs to the load balancer
              # (infra/gcp/70-load-balancer.sh) and is not discoverable from the
              # Cloud Run service, which is why it is a literal.
              echo "URL_SOURCE=load-balancer" >> "$GITHUB_ENV"
              echo "PUBLIC_URL=https://api.myweli.com" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::unknown environment '${ENVIRONMENT}'"
              exit 1
              ;;
          esac
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

      - name: Guard — the service file must match the environment
        run: |
          set -euo pipefail
          # The check that makes "deployed staging onto production" impossible
          # rather than merely unlikely. `metadata.name` is a LITERAL in both
          # service files — never a `__SERVICE_NAME__` substitution — precisely
          # so that it can be asserted against here. The deployer holds
          # project-wide run.admin, so this is the last line before a `replace`
          # that would land on the wrong service.
          NAME=$(awk '/^metadata:/{m=1;next} m&&/^  name:/{print $2;exit}' "${SERVICE_YAML}")
          if [ "${NAME}" != "${SERVICE}" ]; then
            echo "::error::${SERVICE_YAML} declares service '${NAME}', but this run targets '${SERVICE}'"
            exit 1
          fi
          echo "  ✓ ${SERVICE_YAML} → ${NAME}"

      - id: auth
        name: Authenticate to Google Cloud (WIF, no key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/731308991240/locations/global/workloadIdentityPools/github/providers/myweli-repo
          service_account: myweli-deployer@myweli.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Guard — a rollback pin must not be lifted by accident
        # **The step that makes the rollback runbook a control rather than
        # prose.** Both service files commit `traffic: [{percent: 100,
        # latestRevision: true}]`, and `gcloud run services replace` writes that
        # block verbatim — so a `update-traffic --to-revisions` pin, which is
        # the 30-second response to a bad production deploy, is UNDONE by the
        # next deploy of that service. Nothing announces it, and the revision
        # the pin was protecting against becomes the serving one again, because
        # it is once again the latest.
        #
        # That was a slow trap while every deploy was a typed dispatch. Since
        # 2026-08-16 a merge to main deploys staging with no human in the loop,
        # so a pin can now be lifted by someone who was not part of the incident.
        #
        # Fails closed, because the two outcomes are not symmetric: a blocked
        # deploy is visible and self-correcting, while a silent un-pin restores
        # the exact revision somebody is mid-incident about AND reports success.
        #
        # Before the build (no reason to spend four minutes of Docker on a run
        # that cannot deploy) and after auth (it has to ask Cloud Run).
        run: |
          set -euo pipefail
          # `|| true`: on a service that does not exist yet — a first deploy —
          # describe exits non-zero, and there is by definition no pin to lift.
          # Without this the guard would make a new environment undeployable.
          PINNED=$(gcloud run services describe "${SERVICE}" --region "${REGION}" \
                     --format='value(spec.traffic[].revisionName)' 2>/dev/null || true)
          # Empty is the healthy answer: with `latestRevision: true` there is no
          # revisionName to print. `update-traffic --to-latest` restores that,
          # so releasing a pin by hand also clears this guard.
          if [ -z "${PINNED}" ]; then
            echo "  ✓ traffic follows latestRevision — no pin to lift"
            exit 0
          fi
          if [ "${UNPIN}" = "yes" ]; then
            echo "::warning::${SERVICE} was pinned to ${PINNED}. This deploy RELEASES that pin — the new revision takes 100% of traffic."
            echo "  ✓ pin on ${PINNED} released deliberately (unpin=yes)"
            exit 0
          fi
          echo "::error::${SERVICE} traffic is PINNED to ${PINNED} — a rollback is in place, and deploying would silently release it."
          echo ""
          echo "  If you are shipping the fix, re-run this workflow from the Actions tab"
          echo "  with unpin=yes. That is the deliberate act that ends the rollback."
          echo ""
          echo "  If you are NOT (a push to main reaches this line with no inputs at all),"
          echo "  the pin is still holding something. Find out what before deploying:"
          echo ""
          echo "    gcloud run services describe ${SERVICE} --region ${REGION} \\"
          echo "      --format='value(status.traffic[].revisionName)'"
          echo ""
          echo "  Runbook: docs/design/infra-rollback.md"
          exit 1
        env:
          UNPIN: ${{ github.event.inputs.unpin }}

      # **Production PROMOTES; it does not build.** The build step below already
      # explains why — a rebuild ships an artifact staging never ran, from a
      # mutable `FROM dart:stable` base — but that reasoning only protected a
      # production deploy if the operator remembered to fill in `image_tag`,
      # which defaults to empty. A dispatch that forgets it does the documented
      # wrong thing SILENTLY: the run succeeds, every log line agrees, and
      # production serves bytes nothing has ever booted.
      #
      # Refusing is the whole fix. But refusing without saying WHICH tag just
      # moves the work, so the message resolves the digest staging is serving
      # and prints the tag to paste back — the operator still chooses, and the
      # value they are handed is one that has actually run.
      #
      # Deliberately NOT auto-defaulting to staging's tag: staging redeploys on
      # every merge to main, so quietly promoting whatever it happens to be
      # serving would make a production release depend on merge timing. The
      # typed `confirm` gate exists because production deploys are chosen; the
      # artifact should be chosen too.
      - name: Production must promote a rehearsed image, never build a new one
        if: ${{ github.event.inputs.environment == 'production' && github.event.inputs.image_tag == '' }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${PROJECT_ID}/myweli/api"
          echo "::error::a production deploy must name an image_tag — leaving it"
          echo "::error::empty BUILDS A NEW IMAGE, which is the one thing this"
          echo "::error::workflow's own build step says not to do for production."
          echo ""
          STAGING_IMAGE=$(gcloud run services describe myweli-api-staging \
                            --region "${REGION}" \
                            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)
          if [ -n "${STAGING_IMAGE}" ]; then
            echo "  staging is serving: ${STAGING_IMAGE}"
            # NOT `images describe <image>@<digest> --format=…tags`: that returns
            # EMPTY for a digest reference, so the first version of this hint
            # printed "<none>" for a tag that existed. Measured 2026-08-19 on
            # the real registry — which is the only reason it was caught, and
            # the reason the fallback below is also run rather than assumed.
            COMMIT=$(gcloud run services describe myweli-api-staging \
                       --region "${REGION}" \
                       --format='value(spec.template.metadata.labels.commit)' 2>/dev/null || true)
            SUGGEST=""
            if [ -n "${COMMIT}" ]; then
              # The commit label IS the tag by construction (the build step tags
              # with the short SHA). Verified rather than trusted: if the tag
              # does not resolve to the digest staging serves, the label is
              # lying and saying so is more useful than a confident wrong value.
              RESOLVED=$(gcloud artifacts docker images describe \
                           "${IMAGE}:${COMMIT}" \
                           --format='value(image_summary.digest)' 2>/dev/null || true)
              if [ "${IMAGE}@${RESOLVED}" = "${STAGING_IMAGE}" ]; then
                SUGGEST="${COMMIT}"
                echo "  its commit:         ${COMMIT}  (tag verified against that digest)"
              else
                echo "::warning::staging's commit label is ${COMMIT}, but"
                echo "::warning::${IMAGE}:${COMMIT} resolves to ${RESOLVED:-<nothing>},"
                echo "::warning::which is NOT what staging is serving. Do not trust the label."
              fi
            fi
            if [ -z "${SUGGEST}" ]; then
              # Fallback for a revision deployed before the commit label landed,
              # or a label that failed the check above. This form DOES work on a
              # digest.
              SUGGEST=$(gcloud artifacts docker tags list "${IMAGE}" \
                          --filter="version:${STAGING_IMAGE##*@}" \
                          --format='value(tag)' 2>/dev/null | sed 's|.*/tags/||' | head -1 || true)
              echo "  its tag:            ${SUGGEST:-<none found>}"
            fi
            echo ""
            if [ -n "${SUGGEST}" ]; then
              echo "  Dispatch again with image_tag=${SUGGEST} to ship the exact"
              echo "  artifact staging has rehearsed."
            else
              echo "  Could not derive a tag for staging's image. Resolve it by hand"
              echo "  before dispatching — do NOT leave image_tag empty."
            fi
          else
            echo "  (could not read myweli-api-staging to suggest a tag)"
          fi
          echo ""
          echo "  Runbook: docs/design/infra-rollback.md"
          exit 1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} -q

      - name: Build and push, or reuse an existing image
        id: build
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${PROJECT_ID}/myweli/api"
          if [ -n "${IMAGE_TAG}" ]; then
            # **Promotion.** Building again for production would produce a
            # DIFFERENT artifact from the one staging rehearsed, which defeats
            # the reason staging and production share one Artifact Registry
            # (infra-staging.md §2). Assert the tag exists rather than
            # discovering it at `replace` time.
            SHA="${IMAGE_TAG}"
            gcloud artifacts docker images describe "${IMAGE}:${SHA}" >/dev/null
            echo "  ✓ promoting existing ${IMAGE}:${SHA}"
          else
            SHA="${GITHUB_SHA::7}"
            # Cloud Run is linux/amd64 only. The runner is already amd64, so this
            # is free here — it is the local Apple-Silicon build that needs the
            # explicit --platform. Stated so nobody "simplifies" it away.
            docker build --platform linux/amd64 -t "${IMAGE}:${SHA}" backend/
            docker push "${IMAGE}:${SHA}"
            # `:latest` is cosmetic — nothing deploys from it — but a staging
            # deploy moving a tag that reads like production is a small lie, and
            # staging deploys are about to become the frequent ones.
            if [ "${ENVIRONMENT}" = "production" ]; then
              docker tag "${IMAGE}:${SHA}" "${IMAGE}:latest"
              docker push "${IMAGE}:latest"
            fi
          fi
          # **Deploy the DIGEST, not the tag.** Artifact Registry tags are
          # mutable and `backend/Dockerfile` builds `FROM dart:stable`, so
          # `:${SHA}` at 09:00 and `:${SHA}` at 17:00 can be different bytes for
          # the same commit. A production deploy that rebuilds rather than
          # promotes would then ship an artifact staging never ran, while every
          # log line agrees on the tag — and the verify step's image comparison
          # below would confirm the wrong thing, since it compares the string we
          # put in the manifest to the string the manifest now has.
          #
          # Resolving to `@sha256:…` makes the manifest name exactly one build,
          # which is what "promote the digest staging rehearsed" has to mean.
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:${SHA}" \
                     --format='value(image_summary.digest)')
          if [ -z "${DIGEST}" ]; then
            echo "::error::could not resolve a digest for ${IMAGE}:${SHA}"
            exit 1
          fi
          echo "  ✓ ${IMAGE}:${SHA} → ${DIGEST}"
          echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          # Exposed separately because a Sentry release identifier CANNOT be the
          # image reference: release names may not contain `/`, and Sentry
          # silently discards an invalid one — leaving every error grouped under
          # "no release", which is release health not working while looking
          # configured. The short SHA is also the image tag, so a release in
          # Sentry maps to a deployed artifact by inspection.
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}

      - name: Deploy the service
        run: |
          set -euo pipefail
          # Declarative: the whole service (sidecar, secrets, probes, scaling)
          # lives in the service file and is reviewable in a PR. Only the image
          # tag and the release are substituted, so a deploy cannot quietly drift
          # from it — and `metadata.name` is deliberately NOT among them.
          sed -e "s|__IMAGE__|${{ steps.build.outputs.image }}|g" \
              -e "s|__RELEASE__|${{ steps.build.outputs.sha }}|g" \
            "${SERVICE_YAML}" > /tmp/service.yaml
          gcloud run services replace /tmp/service.yaml --region "${REGION}" -q

      - name: Verify the revision actually serves
        run: |
          set -euo pipefail

          # **Assert the image we just deployed is the one serving.** `replace`
          # exiting 0 means the API accepted the manifest, not that traffic
          # moved — and every check below would pass just as happily against
          # the OLD revision.
          SERVING=$(gcloud run services describe "${SERVICE}" --region "${REGION}" \
                      --format='value(spec.template.spec.containers[0].image)')
          if [ "${SERVING}" != "${{ steps.build.outputs.image }}" ]; then
            echo "::error::the serving image is ${SERVING}, not ${{ steps.build.outputs.image }}"
            exit 1
          fi
          echo "  ✓ serving ${SERVING}"

          if [ "${URL_SOURCE}" = "status-url" ]; then
            # Read back, never constructed — Cloud Run publishes two run.app
            # hostnames for one service and `gcloud run services list` prints
            # the one that is NOT `status.url`.
            PUBLIC_URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" \
                          --format='value(status.url)')
            if [ -z "${PUBLIC_URL}" ]; then
              echo "::error::status.url is empty — the revision is not serving"
              exit 1
            fi
          fi

          # This step used to curl the service's own *.run.app address for
          # PRODUCTION, and that could never have worked: `service.yaml` sets
          # `ingress: internal-and-cloud-load-balancing`, so the run.app URL
          # 404s by design and the only public entrance is the load balancer.
          # The check went unnoticed until this workflow's first execution, on
          # 2026-08-12, which failed here while the deploy itself was fine
          # (docs/design/infra-prod-hardening.md §6). Staging is the mirror
          # image: `ingress: all` and no load balancer, so run.app is the ONLY
          # door and a hardcoded hostname would be the wrong answer there.
          echo "Public URL: ${PUBLIC_URL}"
          HEALTH=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${PUBLIC_URL}/health")
          echo "  ✓ /health"

          # **Ask the service what it is.** Everything above this line reasons
          # about the deployment from strings we chose — the file path, the
          # service name, the hostname. `/health` reports the `ENV` the running
          # process actually booted with, which is the one answer that comes
          # from the artifact rather than from the intent. It catches the case
          # no name check can: the right service, serving the wrong config.
          EXPECTED=prod
          [ "${ENVIRONMENT}" = "staging" ] && EXPECTED=staging
          REPORTED=$(printf '%s' "${HEALTH}" | sed -n 's/.*"env"[[:space:]]*:[[:space:]]*"\([a-z]*\)".*/\1/p')
          if [ "${REPORTED}" != "${EXPECTED}" ]; then
            echo "::error::${PUBLIC_URL} reports env='${REPORTED}', expected '${EXPECTED}'. Response: ${HEALTH}"
            exit 1
          fi
          echo "  ✓ it reports ENV=${REPORTED}"
          # /health alone proves nothing — it never touches the database, and it
          # reported ok throughout the Render outage. A DB-backed route is the
          # real check, so both are asserted.
          #
          # Neither proves the service is CONFIGURED: /health reads no config and
          # /providers reads only the repository and the slot service, so both
          # would pass on a revision missing every secret. That hole is closed in
          # the application instead — every guarded fail-fast now fires at boot,
          # so a misconfigured revision never becomes ready and `replace` above
          # fails first (docs/BACKEND.md §3.2.2).
          #
          # This asserts REACHABILITY, not content: since the demo salons were
          # purged, a healthy production returns `{"items":[],"total":0}` with a
          # 200. An empty list here is correct, not a failure.
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "${PUBLIC_URL}/providers" >/dev/null
          echo "  ✓ /providers (database reachable)"
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

      # Runs AFTER the deploy on purpose. As a gate it would block the very
      # deploy that fixes the lag, because deploying is what brings the emitter.
      #
      # And it checks BOTH services every time, not the one this run deployed.
      # The runs that followed #445 were staging pushes and staging DID have the
      # string; a check scoped to the deployed service would have passed on every
      # one of them while production stayed blind for two hours.
      - name: Every alert can still produce the string it watches for
        run: bash infra/gcp/95-emitter-lag.sh
        env:
          PROJECT: myweli
          REGION: europe-west9
