version: 2
updates:
  # Dart/Flutter packages
  - package-ecosystem: "pub"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # The FlutterFire plugins each pin the SAME exact firebase-ios-sdk version
    # in their Package.swift. Bumped one at a time, Swift Package Manager cannot
    # resolve and the iOS build fails (#388 → #391, again #541: core 4.14.0
    # wanted 12.18.0, messaging 16.5.0 still 12.17.0). So they move together,
    # in ONE group with no update-types: Dependabot sorts each package by its
    # own jump, so a minor/major split would part them again on a release that
    # ships a core minor with a messaging major (it happened four times, e.g.
    # core 1.21.1 + messaging 13.0.0 on 2022-08-25).
    groups:
      firebase:
        patterns:
          - "firebase_*"
          - "_flutterfire_internals"

  # The backend's build image. backend/Dockerfile pins
  # `dart:X.Y.Z@sha256:<digest>` — the Dart SDK there is the TLS verifier
  # production runs, and the base's /etc/ssl/certs is its root store, frozen
  # until the digest moves. Pinned so a build cannot quietly regress; tracked
  # here so a new patch release (or a refreshed digest) arrives as a PR rather
  # than when someone remembers. Such a PR is RED on purpose until ci.yml's
  # setup-dart `sdk:` follows in the same PR (backend/test/infra/
  # dart_sdk_pin_test.dart; docs/design/backend-dart-sdk-pin.md §5).
  #
  # Stable tags only. Dependabot's own pre-release filter for docker is a
  # heuristic, and it switches it OFF when `latest` shares its digest with no
  # X.Y.Z tag. dart's `latest`/`stable`/`3` lag a riscv64 build after each
  # release, so the pinned stable is then read as a pre-release and the newest
  # beta is proposed: #764, `3.15.0-118.1.beta`. An `ignore` range survives
  # that. `versions` are RubyGems requirements, tested against the tag with `-`
  # read as `.`. `3.15.0-118.1.beta` is compared as 3.15.0.118.1.beta, which
  # sorts strictly between 3.15.0 and 3.15.1. Dart publishes pre-releases only
  # on X.Y.0, so one `> X.Y.0, < X.Y.1` per minor blocks its betas and no stable
  # release. Rejected: a glob (`*beta*`), which is not a requirement and fails
  # the job; `update-types`, which also blocks stable minors (Dart patches only
  # the newest minor). Cover the pinned minor through the next four, plus the
  # next major's .0; dart_sdk_pin_test.dart names the line to add when a bump
  # outruns them. Design: docs/design/backend-dependabot-docker-stable.md
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "dart"
        versions:
          - "> 3.13.0, < 3.13.1"
          - "> 3.14.0, < 3.14.1"
          - "> 3.15.0, < 3.15.1"
          - "> 3.16.0, < 3.16.1"
          - "> 3.17.0, < 3.17.1"
          - "> 3.18.0, < 3.18.1"
          - "> 3.19.0, < 3.19.1"
          - "> 3.20.0, < 3.20.1"
          - "> 4.0.0, < 4.0.1"

  # GitHub Actions used in CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
